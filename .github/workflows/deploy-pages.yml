name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "data/logistics/**"
  workflow_dispatch:
    inputs:
      ref:
        description: '发布或回滚到指定版本标签 / 提交（留空使用当前分支）'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install tracker test dependencies
        run: npm ci --prefix modules/new-product-followup/work/qa --no-audit --no-fund

      - name: Test logistics trial
        run: |
          node --test tools/logistics-rating/tests/*.test.cjs
          node tools/logistics-rating/tests/browser/cooperation-live-dom.cjs
          node --test tools/logistics-rating/tests/browser/market-readiness.cjs
          node tools/logistics-rating/tests/browser/intake-feedback-dom.cjs
          node --test tools/logistics-rating/tests/browser/transport-scope-dom.cjs
          node --test tools/logistics-rating/tests/browser/transport-scope-full-page.cjs
          node --test tools/logistics-rating/tests/browser/transport-record-integrity.cjs
          node --test tools/logistics-rating/tests/browser/score-list-columns.cjs
          node --test tools/logistics-rating/tests/browser/comparison-layout.cjs
          node tools/logistics-rating/tests/browser/supplier-confirmation-dom.cjs
          node --test tools/logistics-rating/tests/browser/bulk-clean-adoption-dom.cjs

      - name: Run regression tests
        run: npm run test:regression

      - name: Build static site
        env:
          GITHUB_GIST_TOKEN: ${{ secrets.OPS_GIST_TOKEN }}
          GITHUB_GIST_ID: ${{ secrets.OPS_GIST_ID }}
        run: |
          node deploy/build-pages.mjs
          node deploy/write-release-manifest.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: ops-center-release-${{ github.run_id }}
          path: docs
          retention-days: 90

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
