<title>新品跟踪大屏</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: control-room board — KPI strip, five-stage pipeline, SKU × stage matrix with a risk rail; each stage view is a link list + editable detail */
:root{
  --bg:#0B111B;--panel:#121A27;--panel2:#0F1622;--raise:#16213A;--line:#1F2A3C;--line2:#1A2433;
  --fg:#E6ECF5;--fg2:#B8C3D6;--muted:#8A97AD;
  --accent:#4C8DFF;--accent-fg:#7AAEFF;--accent-bg:rgba(76,141,255,.14);
  --ok:#3FC98A;--ok-bg:rgba(63,201,138,.12);--warn:#F5B547;--warn-bg:rgba(245,165,36,.14);
  --bad:#FF8986;--bad-bg:rgba(240,96,93,.15);--idle:#8A97AD;--idle-bg:rgba(138,151,173,.10);
  --btn-fg:#DCE8FF;--btn-bg:#1A2A4A;
  --sans:'Noto Sans SC',"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF1F6;--panel:#FFFFFF;--panel2:#F6F8FB;--raise:#E8EFFD;--line:#D8DEE8;--line2:#E5E9F0;
  --fg:#141B26;--fg2:#3A4659;--muted:#5C687B;
  --accent:#2F6BEA;--accent-fg:#2459C9;--accent-bg:rgba(47,107,234,.10);
  --ok:#147A50;--ok-bg:rgba(20,122,80,.10);--warn:#8F5A00;--warn-bg:rgba(201,130,0,.13);
  --bad:#BE2E2B;--bad-bg:rgba(190,46,43,.10);--idle:#5C687B;--idle-bg:rgba(92,104,123,.10);
  --btn-fg:#FFFFFF;--btn-bg:#2F6BEA;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EEF1F6;--panel:#FFFFFF;--panel2:#F6F8FB;--raise:#E8EFFD;--line:#D8DEE8;--line2:#E5E9F0;
  --fg:#141B26;--fg2:#3A4659;--muted:#5C687B;
  --accent:#2F6BEA;--accent-fg:#2459C9;--accent-bg:rgba(47,107,234,.10);
  --ok:#147A50;--ok-bg:rgba(20,122,80,.10);--warn:#8F5A00;--warn-bg:rgba(201,130,0,.13);
  --bad:#BE2E2B;--bad-bg:rgba(190,46,43,.10);--idle:#5C687B;--idle-bg:rgba(92,104,123,.10);
  --btn-fg:#FFFFFF;--btn-bg:#2F6BEA;color-scheme:light}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
*{box-sizing:border-box}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:700}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--accent-fg)}
.brand h1{font-size:26px;font-weight:700;letter-spacing:.02em}
.brand .sub{font-size:13px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:0;font-size:12px;color:var(--muted)}
.clock .big{font-size:20px;font-weight:600;color:var(--fg)}
.live{color:var(--ok)}.offline{color:var(--warn)}

.in{height:36px;width:100%;min-width:0;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 9px;font:inherit;font-size:13px}
select.in{padding-right:4px}
.in:hover{border-color:var(--muted)}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-bg)}
.ta{height:auto;min-height:96px;padding:8px 10px;line-height:1.6;resize:vertical}
.fld .in{min-width:120px}

.btn{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg2);font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--fg)}
.btn.primary{background:var(--btn-bg);border-color:var(--accent);color:var(--btn-fg)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.x{width:32px;height:32px;flex:none;border:0;background:transparent;color:var(--muted);border-radius:6px;font-size:18px;line-height:1}
.x:hover{background:var(--bad-bg);color:var(--bad)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;align-self:flex-start;max-width:100%}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 16px;border-radius:6px;font-size:13.5px}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--raise);color:var(--fg);font-weight:500}

.banner{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{margin:0;font-size:12px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty strong{color:var(--fg);font-size:16px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 9px;border-radius:99px;white-space:nowrap}
.t-done{color:var(--ok);background:var(--ok-bg)}
.t-doing{color:var(--accent-fg);background:var(--accent-bg)}
.t-wait{color:var(--idle);background:var(--idle-bg)}
.t-risk{color:var(--warn);background:var(--warn-bg)}
.t-block{color:var(--bad);background:var(--bad-bg)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;line-height:1.2}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi .n.bad{color:var(--bad)}.kpi .n.warn{color:var(--warn)}.kpi .n.ok{color:var(--ok)}

.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stage{text-align:left;display:flex;flex-direction:column;gap:9px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg)}
.stage:hover{border-color:var(--accent);background:var(--raise)}
.stage .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stage .no{font-family:var(--mono);font-size:12px;color:var(--accent-fg)}
.stage .nm{font-size:15px;font-weight:700}
.stage .go{font-size:12px;color:var(--accent-fg)}
.stage .big{display:flex;align-items:baseline;gap:6px}
.stage .big b{font-family:var(--mono);font-size:24px;font-weight:600}
.stage .big span{font-size:12.5px;color:var(--muted)}
.meter{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter i.full{background:var(--ok)}
.stage .ln{font-size:12px;color:var(--fg2)}
.stage .rk{font-size:12px;color:var(--warn)}
.stage .rk.none{color:var(--muted)}

.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.main{flex:999 1 720px;min-width:0}
.rail{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.scrollx{overflow-x:auto}
.mx{min-width:1120px;display:flex;flex-direction:column}
.mx-row{display:grid;grid-template-columns:minmax(200px,1.3fr) repeat(6,minmax(124px,1fr)) 86px;gap:8px;align-items:stretch;padding:9px 0;border-top:1px solid var(--line2)}
.mx-head{border-top:0;padding:2px 0 8px;font-size:12px;color:var(--muted)}
.mx-name{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.mx-name .sku{font-family:var(--mono);font-size:15px;font-weight:600}
.mx-name .pn{font-size:13px;color:var(--fg2)}
.mx-name .ac{font-size:12px;color:var(--muted)}
.mx-name .is{font-size:12px;color:var(--warn)}
.cell{border:0;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:9px 11px;border-radius:8px;min-height:56px}
.cell:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.cell .l{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.cell .s{font-size:11.5px;color:var(--fg2);line-height:1.4}
.owner{display:flex;flex-direction:column;justify-content:center;font-size:13px}
.owner small{font-size:11px;color:var(--muted)}

.risk{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);color:var(--fg);text-align:left;width:100%}
.risk:hover{border-color:var(--accent)}
.risk .bar{width:3px;border-radius:2px;flex:none;align-self:stretch}
.risk .bar.bad{background:var(--bad)}.risk .bar.warn{background:var(--warn)}
.risk .rt{display:flex;flex-direction:column;gap:3px;min-width:0}
.risk .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--line2);color:var(--fg2)}
.node{display:flex;gap:12px;align-items:center;padding:9px 0;border:0;border-top:1px solid var(--line2);background:transparent;color:var(--fg);text-align:left;width:100%}
.node .d{font-family:var(--mono);font-size:13px;color:var(--accent-fg);width:44px;flex:none}
.node .t{font-size:13px;flex:1;min-width:0}
.node .g{font-size:11px;color:var(--muted);flex:none}

.list{flex:1 1 270px;max-width:100%;min-width:0;display:flex;flex-direction:column;gap:8px}
.detail{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:16px}
.li{text-align:left;display:flex;flex-direction:column;gap:5px;padding:11px 13px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--fg);width:100%}
.li:hover{border-color:var(--muted)}
.li.on{background:var(--raise);border-color:var(--accent)}
.li .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.li .sku{font-family:var(--mono);font-weight:600}
.li .ac{font-size:12px;color:var(--muted)}
.li .br{font-size:12px;color:var(--fg2)}

.dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.dh .t1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dh .sku{font-family:var(--mono);font-size:22px;font-weight:600}
.dh .pn{font-size:15px;color:var(--fg2)}
.dh .ac{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fact{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
.fact em{font-style:normal;color:var(--warn)}

.steps{list-style:none;margin:0;padding:2px 0 4px;display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:10px;min-width:880px}
.step{display:flex;flex-direction:column;gap:7px}
.step .track{display:flex;align-items:center}
.step .sd{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--line);background:var(--bg)}
.step .sb{flex:1;height:2px;margin-left:6px;background:var(--line)}
.step:last-child .sb{visibility:hidden}
.s-done .sd{background:var(--ok);border-color:var(--ok)}
.s-done .sb{background:var(--ok)}
.s-doing .sd{border:3px solid var(--accent)}
.s-block .sd{border:3px solid var(--bad)}
.step .sn{font-size:13px;font-weight:500}
.s-wait .sn{color:var(--muted)}
.s-block .sn{color:var(--bad)}
.s-doing .sn{color:var(--accent-fg)}

.two{display:flex;flex-wrap:wrap;gap:16px}
.two>.panel{flex:1 1 320px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line2);min-width:0}
.rows li:first-child{border-top:0}
.rows .d{font-family:var(--mono);font-size:12.5px;color:var(--accent-fg);width:44px;flex:none}
.rows .tx{flex:1;min-width:0;font-size:13px}
.rows .tx small{display:block;color:var(--muted);font-size:11.5px}
.rows .st{width:110px;flex:none}
.chk{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--ok);flex:none}
.chk .pending{color:var(--warn)}
.rowform{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.rowform .in{flex:1 1 140px;width:auto}
.rowform .in.w-date{flex:0 1 150px}
.rowform .in.w-s{flex:0 1 110px}

.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gh{display:flex;justify-content:space-between;align-items:baseline}
.gh h2{font-size:16px}
.gh .r{font-family:var(--mono);font-size:18px;font-weight:600}
.gh .r.late{color:var(--warn)}.gh .r.full{color:var(--ok)}
.grow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line2);font-size:13.5px}
.item select{width:104px;flex:none}

.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.phase{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:1px solid var(--line2)}
.phase.cur{background:var(--raise);border-color:var(--accent)}
.phase .pn{font-size:14px;font-weight:700}
.phase p{margin:0;font-size:12.5px;color:var(--fg2);line-height:1.6}

.tbl{width:100%;min-width:640px;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:400;font-size:12px;color:var(--muted);padding:6px 8px 8px 0}
.tbl td{padding:7px 8px 7px 0;border-top:1px solid var(--line2);vertical-align:middle}
.tbl td.d{font-family:var(--mono);color:var(--accent-fg);white-space:nowrap}
.tbl .star{font-family:var(--mono);color:var(--bad);white-space:nowrap}

.dist{display:flex;flex-direction:column;gap:8px}
.dr{display:grid;grid-template-columns:28px 1fr 74px;gap:10px;align-items:center;font-size:13px}
.dr .lb{font-family:var(--mono);color:var(--fg2)}
.dr .bg{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.dr .bg i{display:block;height:100%}
.dr .in{height:30px}

.addbox{border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.seg{display:inline-flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:6px;font-size:12.5px}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--raise);color:var(--fg);font-weight:500}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .zl{stroke:var(--muted);stroke-width:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--accent-bg)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent)}
.lg i.ref{border-top:2px dashed var(--fg2)}
.lg i.neg{border-top:6px solid var(--bad);width:10px}
.lg i.pos{border-top:6px solid var(--accent);width:10px}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.6;white-space:pre-line;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:260px;font-variant-numeric:tabular-nums}
.wf{display:flex;flex-direction:column;gap:6px}
.wf-r{display:grid;grid-template-columns:110px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.wf-r .b{height:12px;border-radius:3px;background:var(--line2);position:relative;overflow:hidden}
.wf-r .b i{position:absolute;top:0;bottom:0;border-radius:3px}
.wf-r .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.wf-r.tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.cpa-big{font-size:15px;line-height:1.8}
.cpa-big b{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--fg)}
.units{display:flex;flex-wrap:wrap;gap:4px}
.units i{width:16px;height:22px;border-radius:3px;border:1px solid var(--line);background:var(--panel2);position:relative;overflow:hidden}
.units i b{position:absolute;left:0;top:0;bottom:0;background:var(--warn)}
.gauge{height:12px;border-radius:6px;background:var(--line2);position:relative;margin:6px 0 4px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.gauge s{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg)}
.note{margin:0;font-size:13px;line-height:1.7;color:var(--fg2)}
.note b{color:var(--fg);font-family:var(--mono)}
.ptbl{min-width:1220px}
.ptbl .in{height:30px;padding:0 6px;font-family:var(--mono);font-size:12.5px;min-width:64px}
.ptbl td.c{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--fg2)}
.ptbl th.c{color:var(--accent-fg)}
.neg{color:var(--bad) !important}.pos{color:var(--ok) !important}
.perfform .in{flex:1 1 96px}
.itms{display:flex;flex-direction:column}
.itm{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-top:1px solid var(--line2)}
.itm-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.itm-n{font-size:13.5px;font-weight:500}
.itm-r{display:flex;gap:6px;align-items:center}
.itm-r select{flex:0 0 96px;width:96px}
.itm-r input{flex:1 1 auto}
.itm-r .btn{height:36px;display:inline-flex;align-items:center;text-decoration:none}
.cfs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.cf-p{color:var(--muted)}.cf-ok{color:var(--ok)}.cf-no{color:var(--bad)}
.ok-btn{border-color:var(--ok);color:var(--ok)}
.ok-btn:hover{background:var(--ok-bg);color:var(--ok)}
.itm .acts .btn,.rows .btn{height:32px;font-size:12.5px}
.rows a.btn{display:inline-flex;align-items:center;text-decoration:none}
.lnk{border:0;background:none;padding:0;color:var(--accent-fg);font:inherit;font-family:var(--mono);font-weight:600;cursor:pointer}
.lnk:hover{text-decoration:underline}
.rolelist{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;align-items:center}

<script>
(function(){

  {name:'起量期 · 第 1–2 周',tactics:'SP 自动、SP 手动广泛 + 词组、新品优惠券'},
  {name:'推排名 · 第 3–4 周',tactics:'核心词精准加价、SB 品牌 / SD 再营销、秒杀'},
  {name:'稳定期',tactics:'否定低转化词、品牌词防御、ACoS 控至目标'}

const VIEWS=[['overview','总览'],['logistics','物流 · 到港'],['content','基础交付'],['promo','推广方案'],['reviews','评论维护'],['perf','经营数据']];
const PF=['sessions','units','sales','adSpend','adSales','adOrders','returns'];
const PF_NAME={sessions:'访客',units:'订单（件）',sales:'销售额',adSpend:'广告花费',adSales:'广告销售额',adOrders:'广告订单',returns:'退货（件）'};
const METRICS=[['net','净利润'],['tacos','TACoS vs 保本'],['cvr','CVR'],['ret','退货率'],['cpa','CPA']];
const ECON=[['price','售价（无销售数据时用）'],['cogs','采购成本 / 件'],['head','头程 / 件'],['fba','FBA 配送费 / 件'],['commission','佣金 %'],['other','其它成本 / 件'],['unsellable','退货不可再售 %'],['targetMargin','目标净利率 %']];
const VIEW_NAME=Object.fromEntries(VIEWS);

const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const TODAY=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const WEEK='周'+'日一二三四五六'[now.getDay()];

const state={links:[],perf:[],ships:[],shipSel:null,delShip:null,me:null,names:{},rejecting:null,shipFilter:'all',addingShip:false,loaded:false,live:false,view:'overview',sel:null,f:{owner:'',site:''},adding:false,editInfo:false,delAsk:null,range:'4w',metric:'net'};
let db=null,userCap=null,pending=false,pointerBusy=false;const namesAsked=new Set();

try{const v=localStorage.getItem('xp-view');if(v&&VIEW_NAME[v])state.view=v;}catch(e){}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>typeof x==='number'&&isFinite(x);
const short=d=>d&&d.length>=10?d.slice(5):(d||'');
const money=n=>'¥'+Math.round(n).toLocaleString('zh-CN');
const days=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function merge(a,b){const out=Array.isArray(a)?a.slice():Object.assign({},a);if(!isObj(b))return out;for(const k of Object.keys(b)){out[k]=isObj(out[k])&&isObj(b[k])?merge(out[k],b[k]):b[k];}return out;}
const clone=o=>JSON.parse(JSON.stringify(o));
const acct=l=>[l.account,l.store,l.site].filter(Boolean).join(' · ');
const chip=(tone,text)=>`<span class="chip t-${tone}"><span class="dot"></span>${esc(text)}</span>`;

function defaults(){
  return {sku:'',name:'',account:'',store:'',site:'',owner:'',launchDate:'',issue:'',updatedAt:'',
    logistics:{mode:'',shipment:'',qty:'',route:'',etaPlanned:'',etaLatest:'',headFreight:null,otherCost:null,
      steps:STEPS.map(()=>({status:'wait',date:''})),checks:CHECKS.map(t=>({text:t,done:false})),logs:[]},
    content:{copy:CG[0].items.map(()=>'wait'),image:CG[1].items.map(()=>'wait'),video:CG[2].items.map(()=>'wait'),
      owners:{copy:'',image:'',video:''},dues:{copy:'',image:'',video:''},note:'',flow:0,frontUrl:'',review:{mgr:null,gm:null}},
    promo:{status:'未开始',reviewer:'',budget:null,spent:null,acosTarget:null,acosActual:null,orders7d:null,rank:'',vine:'',
      phases:PHASES.map(()=>({status:'wait',range:''})),actions:[]},
    reviews:{rating:null,count:null,target:null,vineSent:null,vineReviewed:null,rar:null,dist:[0,0,0,0,0],bad:[],plan:[]},
    econ:{price:null,cogs:null,head:null,fba:null,commission:15,other:null,unsellable:100,targetMargin:10}};
}

/* ---------- shipments ---------- */
function normShip(id,raw){
  const d=merge({linkId:'',no:'',shipment:'',mode:'',qty:null,cartons:'',route:'',etaPlanned:'',etaLatest:'',headFreight:null,otherCost:null,
    steps:[],checks:CHECKS.map(t=>({text:t,done:false})),logs:[],createdAt:'',updatedAt:''},raw||{});
  d.id=id;const st=Array.isArray(d.steps)?d.steps:[];
  d.steps=STEPS.map((_,i)=>merge({status:'wait',date:''},st[i]||{}));
  if(!Array.isArray(d.checks))d.checks=[];if(!Array.isArray(d.logs))d.logs=[];
  return d;
}
function shipsOf(id){return state.ships.filter(s=>s.linkId===id);}
function shipState(sh){
  const st=sh.steps;let last=-1;st.forEach((s,i)=>{if(s.status==='done')last=i;});
  const eff=i=>i<=last?'done':st[i].status;
  const delay=(sh.etaPlanned&&sh.etaLatest)?days(sh.etaPlanned,sh.etaLatest):0;
  let blockIdx=-1;for(let i=0;i<7;i++)if(eff(i)==='block'){blockIdx=i;break;}
  let phase;
  if(blockIdx>=0)phase='block';else if(eff(6)==='done')phase='sellable';else if(eff(2)==='done')phase='port';
  else if([0,1,2].some(i=>eff(i)!=='wait'))phase='transit';else phase='wait';
  let label,k=0;while(k<7&&eff(k)==='done')k++;
  if(phase==='block')label=STEPS[blockIdx]+'异常';else if(phase==='sellable')label='已可售';else if(phase==='wait')label='未出货';
  else label=eff(k)==='doing'?DOING[k]:'待'+STEPS[k];
  let tone=phase==='block'?'block':phase==='sellable'?'done':phase==='wait'?'wait':'doing';
  if(delay>0&&['transit','wait'].includes(phase))tone='risk';
  return{eff,phase,label,tone,delay,blockIdx};
}
function shipAvgHead(id){let f=0,q=0;shipsOf(id).forEach(s=>{if(num(s.headFreight)&&num(s.qty)&&s.qty>0){f+=s.headFreight;q+=s.qty;}});return q?f/q:null;}

/* ---------- profit math ---------- */
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);};
const monday=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);};
const pct=(x,d)=>num(x)?(x*100).toFixed(d==null?1:d)+'%':'—';
const money2=n=>num(n)?'¥'+n.toFixed(2):'—';
const moneyS=n=>num(n)?(n<0?'-':'')+money(Math.abs(n)):'—';
function perfOf(id){return state.perf.filter(r=>r.linkId===id).sort((a,b)=>String(a.from||'').localeCompare(String(b.from||'')));}
function rangeRecs(recs,range){if(range==='all')return recs;const cut=addDays(TODAY,range==='12w'?-84:-28);return recs.filter(r=>(r.to||r.from||'')>=cut);}
function unitEcon(l,price,rr){
  const e=Object.assign({},l.econ);const z=v=>num(v)?v:0;
  if(!num(e.head)){const ah=shipAvgHead(l.id);if(num(ah))e.head=ah;}
  if(!num(price)||price<=0)return null;
  const comm=price*z(e.commission)/100;
  const kept=price-comm-z(e.fba)-z(e.cogs)-z(e.head)-z(e.other);
  const u=Math.min(100,Math.max(0,z(e.unsellable)))/100;
  const returned=-(z(e.fba)+0.2*comm+z(e.other))-u*(z(e.cogs)+z(e.head));
  const r=num(rr)?rr:0;
  return{price,comm,kept,returned,retCost:r*(kept-returned),unit:(1-r)*kept+r*returned,r,head:z(e.head),headAuto:!num(l.econ.head)&&num(e.head),
    missing:[['cogs','采购成本'],['fba','FBA 配送费']].filter(([k])=>!num(e[k])).map(x=>x[1])};
}
function perfCalc(l,recs){
  const S={},has={};PF.forEach(k=>{S[k]=0;});
  recs.forEach(r=>PF.forEach(k=>{if(num(r[k])){S[k]+=r[k];has[k]=true;}}));
  const div=(a,b)=>has[a]&&has[b]&&S[b]>0?S[a]/S[b]:null;
  const price=has.sales&&S.units>0?S.sales/S.units:(num(l.econ.price)?l.econ.price:null);
  const cvr=div('units','sessions'),retRate=div('returns','units'),cpa=div('adSpend','adOrders'),acos=div('adSpend','adSales'),tacos=div('adSpend','sales'),adShare=div('adOrders','units');
  const ue=unitEcon(l,price,retRate);
  const preAd=ue&&has.units?ue.unit*S.units:null;
  const net=preAd!=null?preAd-S.adSpend:null;
  const beTacos=ue?ue.unit/ue.price:null;
  const cpaUnits=num(cpa)&&ue&&ue.unit>0?cpa/ue.unit:null;
  const beCpa=ue?(S.adOrders>0&&S.units>0?ue.unit*S.units/S.adOrders:ue.unit):null;
  const margin=num(net)&&S.sales>0?net/S.sales:null;
  return{S,has,price,cvr,retRate,cpa,acos,tacos,adShare,ue,preAd,net,beTacos,cpaUnits,beCpa,margin,n:recs.length};
}
function perfHealth(l){
  const recs=rangeRecs(perfOf(l.id),'4w');
  if(!recs.length)return{tone:'wait',label:'未录入',sub:'近 4 周没有数据',c:null};
  const c=perfCalc(l,recs);
  if(!c.ue||c.ue.missing.length)return{tone:'wait',label:'缺成本数据',sub:c.ue?'待填 '+c.ue.missing.join('、'):'待填售价或销售额',c};
  const sub='TACoS '+pct(c.tacos)+' · 保本 '+pct(c.beTacos);
  if(num(c.net)&&c.net<0)return{tone:'block',label:'亏损 '+moneyS(c.net),sub,c};
  if(num(c.tacos)&&num(c.beTacos)&&c.tacos>c.beTacos*0.8)return{tone:'risk',label:'接近保本',sub,c};
  return{tone:'done',label:'盈利 '+moneyS(c.net),sub,c};
}
function niceTicks(lo,hi,n){
  const raw=(hi-lo)/n;if(!num(raw)||raw<=0)return [lo,hi];const e=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/e;
  const step=(f<=1?1:f<=2?2:f<=5?5:10)*e;const out=[];
  if(!num(step)||step<=0)return [lo,hi];
  const start=Math.floor(lo/step)*step,end=Math.ceil(hi/step)*step+step/2;
  for(let i=0;i<32;i++){const t=start+i*step;if(!num(t)||t>end)break;const rounded=parseFloat(t.toPrecision(12));if(out.at(-1)===rounded)break;out.push(rounded);}
  return out.length>=2?out:[lo,hi];
}
function chartSVG(o){
  const W=720,H=230,L=60,R=14,T=14,B=26;const n=o.labels.length;
  const all=[];o.series.forEach(s=>s.vals.forEach(v=>{if(num(v))all.push(v);}));
  if(!n||!all.length)return '<p class="hint">这段时间缺少计算这个指标所需的数据。</p>';
  let lo=Math.min(0,...all),hi=Math.max(0,...all);if(lo===hi)hi=lo+1;
  const ticks=niceTicks(lo,hi,4);lo=ticks[0];hi=ticks[ticks.length-1];
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);const bw=(W-L-R)/n;const x=i=>L+bw*i+bw/2;
  let g=ticks.map(t=>`<line class="${t===0?'zl':'gl'}" x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"></line><text class="ax" x="${L-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end">${o.axis(t)}</text>`).join('');
  const step=Math.ceil(n/10);
  g+=o.labels.map((lb,i)=>(i===n-1||(i%step===0&&n-1-i>=Math.max(1,step/2)))?`<text class="ax" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`:'').join('');
  o.series.forEach(s=>{
    if(s.kind==='bar'){const w=Math.min(34,bw*0.62);
      g+=s.vals.map((v,i)=>{if(!num(v))return '';const y0=y(0),y1=y(v);return `<rect x="${(x(i)-w/2).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,Math.abs(y1-y0)).toFixed(1)}" rx="3" fill="${v<0?'var(--bad)':'var(--accent)'}"></rect>`;}).join('');}
    else{let d='',pen=false;s.vals.forEach((v,i)=>{if(num(v)){d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true;}else pen=false;});
      g+=`<path d="${d}" fill="none" stroke="${s.ref?'var(--fg2)':'var(--accent)'}" stroke-width="2"${s.ref?' stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"></path>`;
      if(!s.ref)g+=s.vals.map((v,i)=>num(v)?`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===n-1?4.5:3}" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"></circle>`:'').join('');}
  });
  g+=o.labels.map((_,i)=>`<rect class="hit" x="${(L+bw*i).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${H-T-B}" data-tip="${esc(o.tips[i])}"></rect>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}</svg></div>`;
}
const axMoney=v=>Math.abs(v)>=10000?(v/10000).toFixed(Math.abs(v)%10000?1:0)+'万':String(Math.round(v));
const axPct=v=>(v*100).toFixed(Math.abs(v)<0.1&&v!==0?1:0)+'%';
function tipFor(l,r){const c=perfCalc(l,[r]);
  return `${r.from} ~ ${r.to||''}\n销售额 ${moneyS(c.S.sales)} · ${c.S.units} 件\n净利润 ${moneyS(c.net)}\nTACoS ${pct(c.tacos)} · 保本 ${pct(c.beTacos)}\nCPA ${money2(c.cpa)} · CVR ${pct(c.cvr)}\n退货率 ${pct(c.retRate)}`;}
function norm(id,raw){
  const d=merge(defaults(),raw||{});d.id=id;
  for(const key of ['logistics','content','promo','reviews','econ'])if(!isObj(d[key]))d[key]=defaults()[key];
  const st=Array.isArray(d.logistics.steps)?d.logistics.steps:[];
  d.logistics.steps=STEPS.map((_,i)=>merge({status:'wait',date:''},st[i]||{}));
  ['checks','logs'].forEach(k=>{if(!Array.isArray(d.logistics[k]))d.logistics[k]=[];});
  const rc=(raw&&isObj(raw.content))?raw.content:{};const rit=isObj(rc.items)?rc.items:{};
  CG.forEach(g=>{const a=Array.isArray(rc[g.key])?rc[g.key]:g.items.map((_,i)=>rit[g.key+'-'+i]&&rit[g.key+'-'+i].status);
    d.content[g.key]=g.items.map((_,i)=>ITEM_ST[a[i]]?a[i]:'wait');});
  delete d.content.items;
  if(!isObj(d.content.review))d.content.review={mgr:null,gm:null};
  ['mgr','gm'].forEach(k=>{if(!isObj(d.content.review[k]))d.content.review[k]=null;});
  if(typeof d.content.frontUrl!=='string')d.content.frontUrl='';
  const ph=Array.isArray(d.promo.phases)?d.promo.phases:[];
  d.promo.phases=PHASES.map((_,i)=>merge({status:'wait',range:''},ph[i]||{}));
  if(!Array.isArray(d.promo.actions))d.promo.actions=[];
  const ds=Array.isArray(d.reviews.dist)?d.reviews.dist:[];
  d.reviews.dist=[0,1,2,3,4].map(i=>num(ds[i])?ds[i]:0);
  ['bad','plan'].forEach(k=>{if(!Array.isArray(d.reviews[k]))d.reviews[k]=[];});
  return d;
}

/* ---------- derived status ---------- */
function derive(l){
  const SH=shipsOf(l.id).map(sh=>({sh,st:shipState(sh)}));const nS=SH.length;
  const by=p=>SH.filter(x=>x.st.phase===p);
  const blockShip=SH.filter(x=>x.st.phase==='block'&&x.st.blockIdx<=2),blockPort=SH.filter(x=>x.st.phase==='block'&&x.st.blockIdx>=3);
  const inTransit=SH.filter(x=>x.st.phase==='transit'||(x.st.phase==='block'&&x.st.blockIdx<=2));
  const delayed=SH.filter(x=>x.st.delay>0&&['transit','wait'].includes(x.st.phase));
  const nextEta=inTransit.map(x=>x.sh.etaLatest||x.sh.etaPlanned).filter(Boolean).sort()[0];
  const qtyOf=a=>a.reduce((s,x)=>s+(num(x.sh.qty)?x.sh.qty:0),0);
  let ship;
  if(!nS)ship={tone:'wait',label:'未发货',sub:'还没有货件'};
  else if(blockShip.length)ship={tone:'block',label:blockShip.length+' 票物流异常',sub:'共 '+nS+' 票'};
  else if(delayed.length)ship={tone:'risk',label:delayed.length+' 票延误',sub:'在途 '+inTransit.length+' 票'+(nextEta?' · 最近 ETA '+short(nextEta):'')};
  else if(inTransit.length)ship={tone:'doing',label:'在途 '+inTransit.length+' 票',sub:(nextEta?'最近 ETA '+short(nextEta)+' · ':'')+'共 '+nS+' 票'};
  else if(by('wait').length===nS)ship={tone:'wait',label:'待出货 '+nS+' 票',sub:''};
  else ship={tone:'done',label:'已到港 '+(nS-by('wait').length)+' 票',sub:by('wait').length?'待出货 '+by('wait').length+' 票':'共 '+nS+' 票'};
  const sellN=by('sellable').length,portN=by('port').length+blockPort.length;
  let port;
  if(!nS)port={tone:'wait',label:'待到港',sub:''};
  else if(blockPort.length)port={tone:'block',label:blockPort.length+' 票到港异常',sub:'已可售 '+sellN+'/'+nS+' 票'};
  else if(portN)port={tone:'doing',label:'到港处理 '+portN+' 票',sub:'已可售 '+sellN+'/'+nS+' 票'};
  else if(sellN===nS)port={tone:'done',label:'全部可售',sub:nS+' 票 · '+qtyOf(SH)+' 件'};
  else if(sellN)port={tone:'done',label:'已可售 '+sellN+' 票',sub:qtyOf(by('sellable'))+' 件 · 其余未到港'};
  else port={tone:'wait',label:'待到港',sub:''};
  const delay=delayed.length?Math.max(...delayed.map(x=>x.st.delay)):0;
  let done=0,total=0,started=false;const late=[];
  CG.forEach(g=>{const a=l.content[g.key];const d=a.filter(x=>x==='done').length;done+=d;total+=a.length;
    if(a.some(x=>x!=='wait'))started=true;const due=l.content.dues[g.key];
    if(a.includes('late')||(due&&due<TODAY&&d<a.length))late.push(g.name);});
  const parts=CG.map(g=>g.name+' '+l.content[g.key].filter(x=>x==='done').length+'/'+g.items.length).join(' · ');
  const crs=reviewState(l);const rv=l.content.review;
  let content;
  if(crs==='ok')content={tone:'done',label:'已确认',sub:'主管 + 总经理已确认'};
  else if(crs==='back'){const r=(rv.gm&&rv.gm.ok===false)?rv.gm:rv.mgr;content={tone:'block',label:'被退回',sub:r&&r.note?r.note:parts};}
  else if(crs==='gm')content={tone:'doing',label:'待总经理确认',sub:'主管已确认'};
  else if(late.length)content={tone:'risk',label:late.join('、')+'超期',sub:parts};
  else if(crs==='mgr')content={tone:'doing',label:'待主管确认',sub:parts};
  else if(done===total)content={tone:'risk',label:'缺前台链接',sub:'素材已齐，贴链接后提交确认'};
  else if(started)content={tone:'doing',label:'进行中 '+done+'/'+total,sub:parts};
  else content={tone:'wait',label:'未开始',sub:parts};
  const p=l.promo;const PMAP={'未开始':'wait','方案编写中':'doing','待审核':'doing','执行中':'doing','已结束':'done'};
  const promo={tone:PMAP[p.status]||'wait',label:p.status||'未开始',sub:''};
  const acosOver=num(p.acosTarget)&&num(p.acosActual)&&p.acosActual>p.acosTarget;
  const nextAct=p.actions.filter(a=>a.status!=='done').sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'))[0];
  if(p.status==='执行中')promo.sub=num(p.acosActual)?'ACoS '+p.acosActual+'%'+(num(p.acosTarget)?' · 目标 '+p.acosTarget+'%':''):(num(p.spent)?'已花 '+money(p.spent):'');
  else promo.sub=nextAct?((nextAct.date?short(nextAct.date)+' ':'')+nextAct.text):'';
  if(acosOver&&p.status==='执行中'){promo.tone='risk';promo.label='ACoS 超目标';}
  const r=l.reviews;const open=r.bad.filter(b=>b.status!=='closed').length;
  const nextPlan=r.plan.filter(x=>x.status!=='done').sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'))[0];
  const rs=num(r.rating)?r.rating+'★':'';
  let reviews;
  if(open)reviews={tone:'block',label:open+' 条差评待处理',sub:[num(r.count)?r.count+' 条':'',rs].filter(Boolean).join(' · ')};
  else if(num(r.count)&&r.count>0)reviews={tone:'doing',label:'评分 '+(rs||'—'),sub:r.count+' 条'+(num(r.target)?' · 目标 '+r.target:'')};
  else if(r.plan.some(x=>x.status!=='wait'))reviews={tone:'doing',label:'维护中',sub:nextPlan?nextPlan.text:''};
  else reviews={tone:'wait',label:'未开始',sub:nextPlan?((nextPlan.date?short(nextPlan.date)+' ':'')+nextPlan.text):''};
  return{ship,port,content,promo,reviews,delay,done,total,late,acosOver,open,SH,
    sellable:sellN>0,transitShips:inTransit.length,delayedShips:delayed.length+blockShip.length+blockPort.length};
}

function teamTrend(D){
  const B={};
  D.forEach(({l})=>rangeRecs(perfOf(l.id),'12w').forEach(r=>{if(!r.from)return;const c=perfCalc(l,[r]);if(!num(c.net))return;
    const k=monday(r.from);const b=B[k]||(B[k]={net:0,sales:0,ad:0,n:0});b.net+=c.net;b.sales+=c.S.sales;b.ad+=c.S.adSpend;b.n++;}));
  const keys=Object.keys(B).sort();if(!keys.length)return '';
  const chart=chartSVG({labels:keys.map(short),aria:'团队每周净利润',axis:axMoney,
    series:[{kind:'bar',vals:keys.map(k=>B[k].net)}],
    tips:keys.map(k=>`${k} 当周\n净利润 ${moneyS(B[k].net)}\n销售额 ${moneyS(B[k].sales)}\n广告花费 ${moneyS(B[k].ad)} · TACoS ${pct(B[k].sales?B[k].ad/B[k].sales:null)}\n${B[k].n} 条链接有数据`)});
  return `<section class="panel"><div class="ph"><h2>团队净利润 · 按周</h2><div class="lg"><span><i class="pos"></i>盈利</span><span><i class="neg"></i>亏损</span><span>近 12 周，按记录起始日所在周汇总</span></div></div>${chart}</section>`;
}
function avgRating(L){const r=L.filter(l=>num(l.reviews.rating));if(!r.length)return '—';return (r.reduce((a,l)=>a+l.reviews.rating,0)/r.length).toFixed(1)+'★';}

const fact=(label,ctl)=>`<div class="fact"><span>${label}</span>${ctl}</div>`;

function detailHead(l,c){

const PHASE_RANK={block:0,transit:1,port:2,wait:3,sellable:4};
const sfid=(sh,p)=>'sf-'+sh.id+'-'+p.replace(/\./g,'-');
function sinp(sh,path,o){o=o||{};const v=getPath(sh,path);
  return `<input class="in" id="${sfid(sh,path)}" data-sf="${esc(sh.id)}" data-sp="${path}"${o.kind?` data-kind="${o.kind}"`:''} type="${o.type||'text'}"${o.type==='number'?' step="any" inputmode="decimal"':''} value="${esc(v==null?'':v)}"${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.label?` aria-label="${esc(o.label)}"`:''}>`;}
function ssel(sh,path,opts,label){const v=String(getPath(sh,path));
  return `<select class="in" id="${sfid(sh,path)}" data-sf="${esc(sh.id)}" data-sp="${path}"${label?` aria-label="${esc(label)}"`:''}>${opts.map(([k,t])=>`<option value="${esc(k)}"${String(k)===v?' selected':''}>${esc(t)}</option>`).join('')}</select>`;}
function srowForm(sh,list,fields){return `<form class="rowform" data-form="srow" data-ship="${esc(sh.id)}" data-list="${list}">${fields}<button class="btn" type="submit">添加</button></form>`;}

function shipDates(sh){
  const s0=sh.steps[0].date||sh.steps[1].date;
  const arr=sh.steps[2].date||sh.etaLatest||sh.etaPlanned;
  const end=sh.steps[6].date||sh.steps[5].date||(arr?addDays(arr,7):'');
  return{s0,arr,end};
}
function gantt(SH){
  const rows=SH.map(x=>Object.assign({},x,shipDates(x.sh))).filter(r=>r.s0||r.arr);
  if(!rows.length)return '<p class="hint">货件填了发货日期或预计到港后，这里会排出时间线。</p>';
  const ds=[TODAY];rows.forEach(r=>[r.s0,r.arr,r.end].forEach(d=>{if(d)ds.push(d);}));
  const mn=Date.parse(addDays(ds.slice().sort()[0],-3)),mxd=Date.parse(addDays(ds.slice().sort().pop(),3));
  const W=720,L=120,R=12,T=24,RH=24,H=T+rows.length*RH+6;
  const x=d=>L+(Date.parse(d)-mn)/(mxd-mn)*(W-L-R);
  let g='';
  for(let d=monday(iso(new Date(mn)));Date.parse(d)<=mxd;d=addDays(d,14)){if(Date.parse(d)<mn)continue;
    g+=`<line class="gl" x1="${x(d).toFixed(1)}" x2="${x(d).toFixed(1)}" y1="${T-6}" y2="${H}"></line><text class="ax" x="${x(d).toFixed(1)}" y="12" text-anchor="middle">${short(d)}</text>`;}
  rows.forEach((r,i)=>{
    const y=T+i*RH;const {sh,st}=r;const nm=(sh.no||sh.shipment||'未命名').slice(0,9);
    const col=st.phase==='block'?'var(--bad)':st.tone==='risk'?'var(--warn)':'var(--accent)';
    g+=`<text class="ax" x="${L-8}" y="${y+15}" text-anchor="end" style="font-family:var(--sans);fill:var(--fg2)">${esc(nm)}</text>`;
    const arrived=st.eff(2)==='done',sell=st.phase==='sellable';
    if(r.s0&&r.arr){const a=x(r.s0),b=Math.max(x(r.arr),a+2);
      if(arrived)g+=`<rect x="${a.toFixed(1)}" y="${y+6}" width="${(b-a).toFixed(1)}" height="12" rx="3" fill="${col}"></rect>`;
      else{const tdy=Math.min(Math.max(x(TODAY),a),b);
        g+=`<rect x="${a.toFixed(1)}" y="${y+6}" width="${(b-a).toFixed(1)}" height="12" rx="3" fill="${col}" opacity=".3"></rect>`;
        if(tdy>a)g+=`<rect x="${a.toFixed(1)}" y="${y+6}" width="${(tdy-a).toFixed(1)}" height="12" rx="3" fill="${col}"></rect>`;}}
    else if(r.arr)g+=`<circle cx="${x(r.arr).toFixed(1)}" cy="${y+12}" r="5" fill="${col}"></circle>`;
    if(r.arr&&r.end){const a=x(r.arr)+2,b=Math.max(x(r.end),a+2);
      g+=`<rect x="${a.toFixed(1)}" y="${y+6}" width="${(b-a).toFixed(1)}" height="12" rx="3" fill="${st.phase==='block'&&st.blockIdx>=3?'var(--bad)':'var(--ok)'}" opacity="${sell?1:.3}"></rect>`;}
    const tip=`${sh.no||'未命名货件'}${sh.shipment?' · '+sh.shipment:''}\n${st.label}${st.delay>0?' · 延误 '+st.delay+' 天':''}\n发货 ${r.s0||'—'}\n${arrived?'到港':'预计到港'} ${r.arr||'—'}\n${sell?'可售':'预计可售'} ${r.end||'—'}${num(sh.qty)?'\n'+sh.qty+' 件':''}`;
    g+=`<rect class="hit" x="0" y="${y}" width="${W}" height="${RH}" data-tip="${esc(tip)}" data-act="ship-sel" data-id="${esc(sh.id)}" style="cursor:pointer"></rect>`;
  });
  const tx=x(TODAY);g+=`<line x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${T-8}" y2="${H}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 3"></line><text class="ax" x="${tx.toFixed(1)}" y="${T-10}" text-anchor="middle" style="fill:var(--fg)">今天</text>`;
  return `<div class="lg"><span><i class="pos"></i>出货 → 到港</span><span><i style="border-top:6px solid var(--ok);width:10px"></i>到港 → 可售</span><span><i style="border-top:6px solid var(--warn);width:10px"></i>延误</span><span>浅色 = 还没走完的计划段</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="货件时间线">${g}</svg></div>`;
}

function logisticsView(l,s){
  const all=s.SH.slice().sort((a,b)=>(PHASE_RANK[a.st.phase]-PHASE_RANK[b.st.phase])||(b.st.delay-a.st.delay)||((a.sh.etaLatest||a.sh.etaPlanned||'9').localeCompare(b.sh.etaLatest||b.sh.etaPlanned||'9'))||((b.sh.createdAt||'').localeCompare(a.sh.createdAt||'')));
  const q=a=>a.reduce((t,x)=>t+(num(x.sh.qty)?x.sh.qty:0),0);
  const P=p=>all.filter(x=>x.st.phase===p);
  const issue=all.filter(x=>x.st.phase==='block'||(x.st.delay>0&&['transit','wait'].includes(x.st.phase)));
  const head=all.reduce((t,x)=>t+(num(x.sh.headFreight)?x.sh.headFreight:0),0);const ah=shipAvgHead(l.id);
  const st=(k,v,n,c)=>`<div class="kpi"><span class="k">${k}</span><span class="v ${c||''}" style="font-size:22px">${v}</span><span class="n">${n}</span></div>`;
  const F={all:['全部',all],transit:['在途',P('transit')],port:['到港处理',P('port')],wait:['未出货',P('wait')],sellable:['已可售',P('sellable')],issue:['延误 / 异常',issue]};
  const fk=F[state.shipFilter]?state.shipFilter:'all';const list=F[fk][1];
  let h=`<div class="panel"><div class="ph"><h2>货件汇总</h2><button class="btn primary" data-act="ship-add">新增货件</button></div>
   <div class="kpis">
    ${st('货件',all.length+' 票',q(all)+' 件')}
    ${st('在途',P('transit').length+' 票',q(P('transit'))+' 件')}
    ${st('到港处理中',P('port').length+' 票',q(P('port'))+' 件')}
    ${st('已可售',P('sellable').length+' 票',q(P('sellable'))+' 件','pos')}
    ${st('延误 / 异常',issue.length+' 票',issue.length?'最长延误 '+Math.max(0,...issue.map(x=>x.st.delay))+' 天':'无',issue.length?'neg':'')}
    ${st('头程合计',moneyS(head),'平均 '+(num(ah)?money2(ah):'—')+' / 件')}
   </div></div>`;
  if(state.addingShip){
    const last=[...shipsOf(l.id)].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))[0]||{};
    const f=(id,label,o)=>`<label class="fact" for="ns-${id}">${label}<input class="in" id="ns-${id}" name="${id}" type="${o.type||'text'}"${o.type==='number'?' step="any" inputmode="decimal"':''} value="${esc(o.v||'')}" placeholder="${esc(o.ph||'')}"${o.req?' required':''}></label>`;
    h+=`<form class="panel addbox" data-form="ship"><div class="ph"><h2>新增货件</h2><span class="hint">方式和线路默认沿用上一票</span></div>
      <div class="facts">${f('no','批次 / 票号 *',{v:'第 '+(all.length+1)+' 票',req:true})}${f('shipment','FBA 货件号',{ph:'FBA…'})}
      <label class="fact" for="ns-mode">运输方式<select class="in" id="ns-mode" name="mode"><option value="">请选择</option>${MODES.map(m=>`<option${m===last.mode?' selected':''}>${m}</option>`).join('')}</select></label>
      ${f('qty','数量（件）',{type:'number'})}${f('cartons','箱数',{ph:'如 30 箱'})}${f('route','起运港 → 目的港',{v:last.route,ph:'如 宁波 → Felixstowe'})}
      ${f('shipDate','发货日',{type:'date',v:TODAY})}${f('etaPlanned','原定到港',{type:'date'})}${f('headFreight','头程费用（¥）',{type:'number'})}</div>
      <div class="acts"><button class="btn primary" type="submit">添加</button><button class="btn" type="button" data-act="ship-add-cancel">取消</button></div></form>`;
  }
  h+=`<div class="panel"><div class="ph"><h2>货件时间线</h2><span class="hint">点任一行打开这票货件</span></div>${gantt(all)}</div>`;
  h+=`<div class="panel"><div class="ph"><h2>货件列表</h2><div class="seg" role="group" aria-label="筛选货件">${Object.entries(F).map(([k,[n,a]])=>`<button data-act="ship-filter" data-v="${k}" class="${fk===k?'on':''}" aria-pressed="${fk===k}">${n} ${a.length}</button>`).join('')}</div></div>
   <div class="scrollx"><table class="tbl" style="min-width:980px"><thead><tr><th>批次</th><th>货件号</th><th>方式</th><th>数量</th><th>线路</th><th>当前节点</th><th>发货</th><th>到港 / ETA</th><th>可售</th><th>头程</th><th></th></tr></thead><tbody>
   ${list.length?list.map(({sh,st})=>{const d=shipDates(sh);const on=sh.id===state.shipSel;
     return `<tr${on?' style="background:var(--raise)"':''}><td style="font-weight:500">${esc(sh.no||'—')}</td><td class="mono" style="font-size:12px;color:var(--fg2)">${esc(sh.shipment||'—')}</td><td>${esc(sh.mode||'—')}</td><td class="mono">${num(sh.qty)?sh.qty:'—'}</td><td style="color:var(--fg2)">${esc(sh.route||'—')}</td>
      <td>${chip(st.tone,st.label)}</td><td class="d">${short(d.s0)||'—'}</td><td class="d">${short(d.arr)||'—'}${st.delay>0?` <span class="neg" style="font-family:var(--sans);font-size:11.5px">+${st.delay}天</span>`:''}</td><td class="d">${sh.steps[6].date?short(sh.steps[6].date):'—'}</td><td class="mono">${num(sh.headFreight)?moneyS(sh.headFreight):'—'}</td>
      <td><button class="btn" data-act="ship-sel" data-id="${esc(sh.id)}" aria-expanded="${on}">${on?'收起':'明细'}</button></td></tr>`;}).join(''):`<tr><td colspan="11" class="hint">${all.length?'这个筛选下没有货件':'还没有货件，点「新增货件」录入第一票。'}</td></tr>`}
   </tbody></table></div></div>`;
  const cur=all.find(x=>x.sh.id===state.shipSel);

function shipDetail(sh,st){

    :`<button class="btn" data-act="ship-del-ask">删除货件</button><button class="btn" data-act="ship-sel" data-id="${esc(sh.id)}">收起</button>`;
  return `<div class="panel" style="border-color:var(--accent)" id="ship-detail"><div class="dh"><span class="t1"><span style="font-size:18px;font-weight:700">${esc(sh.no||'未命名货件')}</span>${chip(st.tone,st.label)}${st.delay>0?`<span class="chip t-risk">延误 ${st.delay} 天</span>`:''}</span><div class="acts">${del}</div></div>
   <div class="facts">

    ${fact('FBA 货件号',sinp(sh,'shipment'))}
    ${fact('运输方式',ssel(sh,'mode',[['','请选择'],...MODES.map(m=>[m,m])],'运输方式'))}
    ${fact('数量（件）',sinp(sh,'qty',{type:'number',kind:'num'}))}
    ${fact('箱数',sinp(sh,'cartons'))}
    ${fact('起运港 → 目的港',sinp(sh,'route'))}
    ${fact('原定到港',sinp(sh,'etaPlanned',{type:'date'}))}
    ${fact('最新到港'+(st.delay>0?` <em>延误 ${st.delay} 天</em>`:''),sinp(sh,'etaLatest',{type:'date'}))}
    ${fact('头程费用（¥）',sinp(sh,'headFreight',{type:'number',kind:'num'}))}

   </div>
   <h2>物流与到港节点</h2><div class="scrollx"><ol class="steps">
    ${sh.steps.map((x,i)=>`<li class="step s-${st.eff(i)}"><span class="track"><span class="sd"></span><span class="sb"></span></span><span class="sn">${STEPS[i]}</span>${ssel(sh,'steps.'+i+'.status',ent(STEP_ST),STEPS[i]+' 状态')}${sinp(sh,'steps.'+i+'.date',{type:'date',label:STEPS[i]+' 日期'})}</li>`).join('')}
   </ol></div><p class="hint">前三个节点算「物流」，后四个算「到港交付」。某个节点标为已完成，它之前的节点自动算完成。</p>

     <ul class="rows">${sh.checks.map((c,i)=>`<li><label class="chk"><input type="checkbox" id="${sfid(sh,'checks.'+i+'.done')}" data-sf="${esc(sh.id)}" data-sp="checks.${i}.done" data-kind="bool"${c.done?' checked':''}><span class="${c.done?'':'pending'}">${esc(c.text)}</span></label><button class="x" data-act="srow-del" data-ship="${esc(sh.id)}" data-list="checks" data-i="${i}" aria-label="删除 ${esc(c.text)}">×</button></li>`).join('')}</ul>
     ${srowForm(sh,'checks','<input class="in" name="text" placeholder="新增清单项" required aria-label="清单项">')}</div>
    <div class="panel" style="background:var(--panel2)"><h2>跟进记录</h2>
     <ul class="rows">${logs.length?logs.map(({x,i})=>`<li><span class="d">${short(x.date)}</span><span class="tx">${esc(x.text)}${x.who?`<small>${esc(x.who)}</small>`:''}</span><button class="x" data-act="srow-del" data-ship="${esc(sh.id)}" data-list="logs" data-i="${i}" aria-label="删除这条记录">×</button></li>`).join(''):'<li class="hint">还没有记录</li>'}</ul>

   </div></div>`;
}

const myId=()=>state.me&&state.me.id;
const who=id=>id?(state.names[id]||'…'):'';
const okUrl=u=>/^https?:\/\/[^\s]+$/i.test(u||'');
function reviewState(l){
  const c=l.content;const m=c.review.mgr,g=c.review.gm;
  if(g&&g.ok===true)return 'ok';
  if((m&&m.ok===false)||(g&&g.ok===false))return 'back';
  if(m&&m.ok===true)return 'gm';
  return c.frontUrl?'mgr':'nourl';
}
function cfLine(label,rec,waiting){
  if(!rec)return `<span class="cf cf-p">${label}：${waiting?'待确认':'—'}</span>`;
  if(rec.ok)return `<span class="cf cf-ok">✓ ${label} ${esc(who(rec.by))} ${short((rec.at||'').slice(0,10))}</span>`;
  return `<span class="cf cf-no">${label}退回${rec.note?'：'+esc(rec.note):''}（${esc(who(rec.by))} ${short((rec.at||'').slice(0,10))}）</span>`;
}

function content(l,s){

function perfEconIssue(e){
  for(const [key] of ECON){const value=e[key];if(value==null||value==='')continue;const percent=['commission','unsellable','targetMargin'].includes(key);if(!num(value)||Math.abs(value)>Number.MAX_SAFE_INTEGER||value<0||key==='price'&&value===0||percent&&value>100)return percent?'比例必须在 0% 到 100% 之间':'成本或售价无效，请核对数值';}return '';
}
function perfPreviewEcon(e,baseline={}){
  const out={...e};for(const [key] of ECON)if(perfEconIssue({[key]:e[key]})){
    const old=baseline[key];out[key]=num(old)&&!perfEconIssue({[key]:old})?old:['commission','unsellable','targetMargin'].includes(key)?(num(e[key])?Math.max(0,Math.min(100,e[key])):0):key==='price'?null:0;
  }return out;
}
function perfView(l,editorsOnly=false,previewOnly=false){
  const all=perfOf(l.id);const recs=rangeRecs(all,state.range);const c=perfCalc(l,recs);const S=c.S;const ue=c.ue;const e=l.econ;
  const seg=(items,cur,act,label)=>`<div class="seg" role="group" aria-label="${label}">${items.map(([k,t])=>`<button data-act="${act}" data-v="${k}" class="${cur===k?'on':''}" aria-pressed="${cur===k}">${t}</button>`).join('')}</div>`;
  const kpi=(k,v,nt,cls,vcls)=>`<div class="kpi"><span class="k">${k}</span><span class="v ${vcls||''}">${v}</span><span class="n ${cls||''}">${nt}</span></div>`;
  const tacosCls=num(c.tacos)&&num(c.beTacos)?(c.tacos>c.beTacos?'bad':c.tacos>c.beTacos*0.8?'warn':'ok'):'';
  let h=`<div class="panel"><div class="ph"><h2>经营数据</h2>${seg([['4w','近 4 周'],['12w','近 12 周'],['all','全部']],state.range,'range','时间范围')}</div>
   ${recs.length?`<div class="kpis">
    ${kpi('销售额',moneyS(S.sales),S.units+' 件 · 均价 '+money2(c.price))}
    ${kpi('净利润',moneyS(c.net),'净利率 '+pct(c.margin),'',num(c.net)?(c.net<0?'neg':'pos'):'')}
    ${kpi('CVR',pct(c.cvr,2),'访客 '+S.sessions)}
    ${kpi('退货率',pct(c.retRate),'退货 '+S.returns+' 件')}
    ${kpi('CPA',money2(c.cpa),'广告单 '+S.adOrders+' · 占比 '+pct(c.adShare,0))}
    ${kpi('TACoS',pct(c.tacos),'保本 '+pct(c.beTacos),tacosCls)}
    ${kpi('ACoS',pct(c.acos),'广告销售额 '+moneyS(S.adSales))}
   </div>`:`<p class="hint">${all.length?'这个时间范围内没有记录，换「全部」看看。':'还没有经营数据。在下方「周期数据」里按周录入访客、订单、销售额、广告和退货，再把单件成本填好，就能算出 CPA、保本 TACoS 和净利润。'}</p>`}</div>`;

  // CPA & break-even
  let be='';
  if(!editorsOnly){
  if(!ue)be='<p class="note">需要售价才能测算：录入带销售额的周期数据，或在右侧填「售价」。</p>';
  else if(ue.unit<=0)be=`<p class="note">单件广告前利润是 <b class="neg">${money2(ue.unit)}</b>，还没投广告就已经亏了。先看右侧哪一项成本最大，调价或降成本。</p>`;
  else{
    const tm=num(e.targetMargin)?e.targetMargin/100:0;
    const mx=Math.max(c.tacos||0,c.beTacos||0)*1.25||0.3;
    const units=num(c.cpaUnits)?Array.from({length:Math.min(Math.ceil(c.cpaUnits),30)},(_,i)=>`<i><b style="width:${Math.round(Math.min(1,c.cpaUnits-i)*100)}%"></b></i>`).join(''):'';
    const k=S.adOrders>0&&S.units>=S.adOrders?(S.units-S.adOrders)/S.adOrders:null;
    const gap=num(c.tacos)?c.beTacos-c.tacos:null;
    be=`${num(c.cpa)?`<div class="cpa-big">一个广告订单花 <b>${money2(c.cpa)}</b>，要 <b>${c.cpaUnits.toFixed(1)}</b> 件产品的利润来养</div>
      <div class="units" role="img" aria-label="${c.cpaUnits.toFixed(1)} 件的利润">${units}</div>
      <p class="note">每件产品广告前能赚 <b>${money2(ue.unit)}</b>。${k!=null?`平均每个广告单还带来 <b>${k.toFixed(1)}</b> 个自然单，整体看 CPA 不超过 <b>${money2(c.beCpa)}</b> 就不亏；当前 ${c.cpa<=c.beCpa?'<span class="pos">在线内</span>':'<span class="neg">超出了</span>'}。`:''}</p>`
      :'<p class="note">录入广告花费和广告订单后，会算出一个 CPA 要几件利润来养。</p>'}
      <div><div class="ph"><span style="font-size:13px;font-weight:500">TACoS 对比保本线</span><span class="mono" style="font-size:13px">${pct(c.tacos)} / ${pct(c.beTacos)}</span></div>
       <div class="gauge" role="img" aria-label="TACoS ${pct(c.tacos)}，保本 ${pct(c.beTacos)}"><i style="width:${num(c.tacos)?Math.min(100,c.tacos/mx*100):0}%;background:${tacosCls==='bad'?'var(--bad)':tacosCls==='warn'?'var(--warn)':'var(--accent)'}"></i><s style="left:${Math.min(100,c.beTacos/mx*100)}%" title="保本线"></s></div></div>
      <p class="note">保本 TACoS = 单件广告前利润 ÷ 售价 = ${money2(ue.unit)} ÷ ${money2(ue.price)} = <b>${pct(c.beTacos)}</b>。${gap!=null?(gap>=0?`当前 TACoS ${pct(c.tacos)}，还有 <b class="pos">${(gap*100).toFixed(1)}</b> 个百分点空间。`:`当前 TACoS ${pct(c.tacos)}，超出 <b class="neg">${(-gap*100).toFixed(1)}</b> 个百分点。`):''}${tm>0?`想留 ${(tm*100).toFixed(0)}% 净利率，TACoS 要压到 <b>${pct(c.beTacos-tm)}</b> 以内${c.beTacos-tm<=0?'（目前做不到，需要先提高单件利润）':''}。`:''}</p>`;
  }
  }
  // waterfall
  let wf='';
  const econIssue=perfEconIssue(e);
  const trialEcon=perfPreviewEcon(e),trialPrice=num(trialEcon.price)?trialEcon.price:c.price,trialUE=unitEcon({...l,econ:trialEcon},trialPrice,c.retRate);
  if(trialUE&&!editorsOnly){
    const ue=trialUE,e=trialEcon;
    const lo=Math.min(0,ue.unit,ue.kept),span=ue.price-lo;const pos=v=>(v-lo)/span*100;
    const rows=[];let run=ue.price;
    rows.push(['售价',0,ue.price,ue.price,'var(--accent)','']);
    [['佣金',ue.comm],['FBA 配送费',num(e.fba)?e.fba:0],['采购成本',num(e.cogs)?e.cogs:0],[ue.headAuto?'头程（货件均值）':'头程',ue.head],['其它',num(e.other)?e.other:0]].forEach(([n,v])=>{rows.push([n,run-v,run,-v,'var(--bad)','']);run-=v;});
    rows.push(['未退货单件利润',Math.min(0,ue.kept),Math.max(0,ue.kept),ue.kept,ue.kept<0?'var(--bad)':'var(--ok)','tot']);
    rows.push(['退货损耗 '+pct(ue.r),ue.kept-ue.retCost,ue.kept,-ue.retCost,'var(--bad)','']);
    rows.push(['单件广告前利润',Math.min(0,ue.unit),Math.max(0,ue.unit),ue.unit,ue.unit<0?'var(--bad)':'var(--ok)','tot']);
    wf=`<div class="wf">${rows.map(([n,a,b,v,col,cls])=>`<div class="wf-r ${cls}"><span>${n}</span><span class="b"><i style="left:${pos(Math.min(a,b)).toFixed(1)}%;width:${Math.max(0.5,Math.abs(pos(b)-pos(a))).toFixed(1)}%;background:${col};opacity:${col==='var(--bad)'&&!cls?.6:1}"></i></span><span class="v ${v<0&&cls?'neg':''}">${v<0?'-':''}${money2(Math.abs(v))}</span></div>`).join('')}</div>
    <p class="hint">单件试算售价取${num(e.price)?'上方输入值':'所选周期实际均价'}；经营汇总与左侧保本分析仍按所选周期实际均价计算。 退货件按退回佣金 80%、FBA 配送费不退、不可再售部分损失采购成本和头程来算。${ue.missing.length?`<span style="color:var(--warn)">还没填：${ue.missing.join('、')}，结果会偏高。</span>`:''}</p>`;
  }
  if(econIssue)wf='<p class="note" role="alert">'+esc(econIssue)+'；图表继续显示预览，异常比例暂按 0–100% 边界值计算，异常金额暂按 0（售价用实际均价）；异常值未保存。当前图示不可再售比例 '+trialEcon.unsellable+'%。</p>'+wf;
  h+=`<div class="two"> 
    <div class="panel"><h2>一个 CPA 要几件利润来养</h2><div data-perf-break-even>${be}</div></div>
    <div class="panel"><h2>单件利润测算</h2>
      <div class="facts">${ECON.map(([k,n])=>{const ah=k==='head'?shipAvgHead(l.id):null;
        return fact(k==='price'?'售价（单件试算）':n,inp(l,'econ.'+k,{type:'number',kind:'num',ph:num(ah)?'留空用货件均值 '+ah.toFixed(2):''}));}).join('')}</div><div data-perf-unit aria-live="polite">${wf}</div></div>
  </div>`;

  // trend
  if(!editorsOnly&&!previewOnly){
  const R=recs.filter(r=>r.from);const m=state.metric;
  let series=[],axis=axPct,legend='';
  const cs=R.map(r=>perfCalc(l,[r]));
  if(m==='net'){series=[{kind:'bar',vals:cs.map(x=>x.net)}];axis=axMoney;legend='<span><i class="pos"></i>盈利</span><span><i class="neg"></i>亏损</span>';}
  else if(m==='tacos'){series=[{kind:'line',vals:cs.map(x=>x.tacos)},{kind:'line',ref:true,vals:cs.map(x=>x.beTacos)}];legend='<span><i></i>实际 TACoS</span><span><i class="ref"></i>保本 TACoS</span>';}
  else if(m==='cvr'){series=[{kind:'line',vals:cs.map(x=>x.cvr)}];legend='<span><i></i>CVR = 订单 ÷ 访客</span>';}
  else if(m==='ret'){series=[{kind:'line',vals:cs.map(x=>x.retRate)}];legend='<span><i></i>退货率 = 退货 ÷ 订单</span>';}
  else{series=[{kind:'line',vals:cs.map(x=>x.cpa)},{kind:'line',ref:true,vals:cs.map(x=>x.beCpa)}];axis=v=>'¥'+axMoney(v);legend='<span><i></i>CPA</span><span><i class="ref"></i>保本 CPA（含自然单）</span>';}
  h+=`<div class="panel"><div class="ph"><h2>趋势</h2>${seg(METRICS,m,'metric','指标')}</div>
    ${R.length?`<div class="lg">${legend}</div>`+chartSVG({labels:R.map(r=>short(r.from)),series,axis,aria:(METRICS.find(x=>x[0]===m)||['',''])[1]+' 趋势',tips:R.map(r=>tipFor(l,r))}):'<p class="hint">录入周期数据后显示趋势。</p>'}</div>`;

  }
  if(previewOnly)return h;
  // records
  const last=all[all.length-1];
  const validPeriodDate=value=>typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&Number.isFinite(Date.parse(value))&&new Date(value).toISOString().slice(0,10)===value;
  const fallbackDate=monday(addDays(TODAY,-7)),lastDate=last&&(last.to||last.from);
  const suggested=validPeriodDate(lastDate)?addDays(lastDate,1):fallbackDate;
  const nf=validPeriodDate(suggested)&&validPeriodDate(addDays(suggested,6))?suggested:fallbackDate,nt=addDays(nf,6);
  const rowsDesc=all.slice().reverse();
  h+=`<div class="panel"><div class="ph"><h2>周期数据</h2><span class="hint">建议每周一录上一周（周一到周日）。金额统一按人民币。</span></div>
   <div class="scrollx"><table class="tbl ptbl"><thead><tr><th>起始</th><th>结束</th>${PF.map(k=>`<th>${PF_NAME[k]}</th>`).join('')}<th class="c">CVR</th><th class="c">退货率</th><th class="c">CPA</th><th class="c">TACoS</th><th class="c">保本 TACoS</th><th class="c">净利润</th><th><span hidden>删除</span></th></tr></thead><tbody>
   ${rowsDesc.length?rowsDesc.map(r=>{const x=perfCalc(l,[r]);return `<tr><td class="d">${esc(r.from)}</td>
     <td><input class="in" type="date" id="pf-${esc(r.id)}-to" data-pf="${esc(r.id)}" data-field="to" value="${esc(r.to||'')}" aria-label="结束日期"></td>
     ${PF.map(k=>`<td><input class="in" type="number" step="any" inputmode="decimal" id="pf-${esc(r.id)}-${k}" data-pf="${esc(r.id)}" data-field="${k}" value="${num(r[k])?r[k]:''}" aria-label="${PF_NAME[k]}"></td>`).join('')}
     <td class="c">${pct(x.cvr,2)}</td><td class="c">${pct(x.retRate)}</td><td class="c">${money2(x.cpa)}</td><td class="c ${num(x.tacos)&&num(x.beTacos)&&x.tacos>x.beTacos?'neg':''}">${pct(x.tacos)}</td><td class="c">${pct(x.beTacos)}</td><td class="c ${num(x.net)?(x.net<0?'neg':'pos'):''}">${moneyS(x.net)}</td>
     <td><button class="x" data-act="perf-del" data-id="${esc(r.id)}" aria-label="删除 ${esc(r.from)} 这条记录">×</button></td></tr>`;}).join(''):'<tr><td colspan="17" class="hint">还没有记录</td></tr>'}
   </tbody></table></div>
   <form class="rowform perfform" data-form="perf">
     <input class="in w-date" type="date" name="from" value="${nf}" required aria-label="起始日期">
     <input class="in w-date" type="date" name="to" value="${nt}" required aria-label="结束日期">
     ${PF.map(k=>`<input class="in" type="number" step="any" inputmode="decimal" name="${k}" placeholder="${PF_NAME[k]}" aria-label="${PF_NAME[k]}">`).join('')}
     <button class="btn primary" type="submit">添加一期</button></form></div>`;
  return h;
}

/* Live preview replaces results only: input identity and focus stay intact. */
function perfReadInputs(link){
  const econ={...link.econ};let error='';
  for(const input of app.querySelectorAll('[data-f^="econ."]')){
    const key=input.dataset.f.slice(5);if(!ECON.some(([k])=>k===key)){error='无效成本字段';break;}
    const value=input.value===''?null:Number(input.value),percent=['commission','unsellable','targetMargin'].includes(key);
    const invalid=input.validity.badInput||value!==null&&(!num(value)||Math.abs(value)>Number.MAX_SAFE_INTEGER||value<0||key==='price'&&value===0||percent&&value>100);
    input.setAttribute('aria-invalid',String(Boolean(invalid)));
    if(invalid)error=percent?'比例必须在 0% 到 100% 之间':'请输入有效非负数；售价必须大于 0，数值不能超出安全计算范围';
    econ[key]=value;
  }
  const preview={...link,econ:perfPreviewEcon(econ,link.econ)};
  if(!error){
    const c=perfCalc(preview,rangeRecs(perfOf(link.id),state.range)),unit=unitEcon(preview,num(econ.price)?econ.price:c.price,c.retRate);
    const values=[c.preAd,c.net,c.margin,...Object.values(unit||{}).filter(v=>typeof v==='number')];
    if(values.some(v=>v!=null&&(!num(v)||Math.abs(v)>Number.MAX_SAFE_INTEGER)))error='计算超出可靠范围，请核对金额、数量和小数点';
  }
  return {preview,error};
}
function perfLiveInput(){
  if(state.view!=='perf')return;
  const link=state.links.find(l=>l.id===state.sel);if(!link)return;
  const {preview,error}=perfReadInputs(link);
  if(error.includes('计算超出可靠范围')){const node=app.querySelector('[data-perf-unit]');if(node){node.querySelector('[data-perf-warning]')?.remove();const note=document.createElement('p');note.className='note';note.dataset.perfWarning='';note.setAttribute('role','alert');note.textContent=error+'；保留上次有效图表，异常值未保存。';node.prepend(note);}return;}
  const template=document.createElement('template');template.innerHTML=perfView(preview,false,true);
  for(const selector of ['.kpis','[data-perf-unit]','[data-perf-break-even]']){
    const target=app.querySelector(selector),next=template.content.querySelector(selector);if(target&&next)target.replaceChildren(...next.childNodes);
  }
  if(error){const node=app.querySelector('[data-perf-unit]');if(node){const note=document.createElement('p');note.className='note';note.setAttribute('role','alert');note.textContent=error+'；异常字段暂用已保存的有效值，原值也异常时比例按 0–100% 边界预览，金额按 0（售价用实际均价）；异常值未保存。图示不可再售比例 '+preview.econ.unsellable+'%。';node.prepend(note);}}
}

app.addEventListener('submit',e=>{

    if(fd.shipDate){doc.steps[0]={status:fd.shipDate<=TODAY?'done':'wait',date:fd.shipDate};}

    if(db)db.doc('ships/'+id).set(doc).then(()=>toast('已添加 '+fd.no),writeErr);

  }
  if(f.dataset.form==='srow'){
    const sh=state.ships.find(x=>x.id===f.dataset.ship);if(!sh)return;const list=f.dataset.list;const c=clone(sh);delete c.id;
    c[list].push(list==='checks'?{text:fd.text,done:false}:{date:fd.date,text:fd.text,who:fd.who||''});

  }
  if(f.dataset.form==='perf'){
    const l=state.links.find(x=>x.id===state.sel);if(!l||!fd.from)return;
    if(fd.to&&fd.to<fd.from){toast('结束日期不能早于起始日期');return;}
    const id=l.id+'__'+fd.from;
    if(state.perf.some(r=>r.id===id)){toast(fd.from+' 起始的这一期已经录过了，直接在表格里改。');return;}
    const doc={linkId:l.id,from:fd.from,to:fd.to||fd.from,updatedAt:new Date().toISOString()};
    PF.forEach(k=>{const v=fd[k]===''?null:Number(fd[k]);doc[k]=num(v)?v:null;});
    state.perf.push(Object.assign({id},doc));render(true);
    if(db)db.doc('perf/'+id).set(doc).then(()=>toast('已添加 '+fd.from+' 这一期'),writeErr);
    return;
  }
  if(f.dataset.form==='row'){
    const l=state.links.find(x=>x.id===state.sel);if(!l)return;
    const list=f.dataset.list;const c=strip(l);const arr=getPath(c,list);

    if(list==='logistics.checks')row={text:fd.text,done:false};
    else if(list==='logistics.logs')row={date:fd.date,text:fd.text,who:fd.who||''};
    else if(list==='promo.actions')row={date:fd.date,text:fd.text,who:fd.who||'',status:'wait'};
    else if(list==='reviews.plan')row={date:fd.date,text:fd.text,status:'wait'};
    else if(list==='reviews.bad')row={star:Number(fd.star)||1,date:fd.date,issue:fd.issue,action:fd.action||'',status:'open'};
    if(!row)return;arr.push(row);const top=list.split('.')[0];save(l.id,{[top]:c[top]});
  }
});

/* ---------- boot ---------- */
/* Standalone mode: opened outside Claude (no window.claude), keep data in this browser's localStorage.
   Same API surface as the Claude db capability: doc(path)/collection(name), set/update/delete/onSnapshot.
   To move to a real backend, replace localDb() with an adapter that keeps this surface. */
const LOCAL=!(window.claude&&window.claude.use);
function localDb(){
  const KEY='xinpin-tracker-db';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){data={};}
  const subs=new Set();
  const flush=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast('浏览器存储写入失败，数据可能没保存');}subs.forEach(f=>f());};
  const docsIn=name=>Object.keys(data).filter(k=>k.split('/').length===2&&k.split('/')[0]===name).map(k=>({id:k.split('/')[1],exists:true,data:()=>data[k]}));
  const watch=fire=>{subs.add(fire);setTimeout(fire,0);return()=>subs.delete(fire);};
  return{
    _dump:()=>clone(data),_load:obj=>{data=clone(obj);flush();},
    collection:name=>({onSnapshot:cb=>watch(()=>cb({docs:docsIn(name)}))}),
    doc:path=>({
      onSnapshot:cb=>watch(()=>cb({exists:!!data[path],data:()=>data[path]})),
      set:o=>{data[path]=clone(o);flush();return Promise.resolve();},
      update:o=>{if(!data[path])return Promise.reject({code:'invalid_argument'});data[path]=merge(data[path],clone(o));flush();return Promise.resolve();},
      delete:()=>{delete data[path];flush();return Promise.resolve();}
    })
  };
}
render(true);
(async function(){
  if(LOCAL){db=localDb();state.me={id:'local',isOwner:true};state.names.local='本机';}
  else try{
    db=await window.claude.use('db');
  }catch(e){db=null;}
  if(!db){state.loaded=true;state.live=false;render();return;}
  db.collection('links').onSnapshot(snap=>{
    state.links=snap.docs.filter(d=>d.exists).map(d=>norm(d.id,d.data()));
    state.loaded=true;state.live=true;render();
  },err=>{state.loaded=true;state.live=false;render();toast(err&&err.code==='revoked'?'访问权限已变更，页面变为只读。':'和共享存储的连接中断了，请刷新页面。');});
  db.collection('ships').onSnapshot(snap=>{
    state.ships=snap.docs.filter(d=>d.exists).map(d=>normShip(d.id,d.data()));render();
  },()=>{});
  db.collection('perf').onSnapshot(snap=>{
    state.perf=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));render();
  },()=>{});
})();

  if(LOCAL)return;
