<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>万行容量与稳定性测试</title><style>body{font:15px system-ui;margin:20px;color:#213047}button{padding:8px;margin:4px}pre{white-space:pre-wrap}iframe{width:100%;height:700px;border:1px solid #ccc}</style><h1>隔离容量、备份恢复与稳定性测试 :8770</h1><p>仅合成数据，所有写入限制在8770。建议目标：万行首屏≤10秒、筛选≤2秒、导出≤5秒；超限仍不得丢数据或损坏存储。</p><button id="seed">建立10000行/500公司合成数据</button><button id="open">测量万行报价页面加载</button><button id="backup">保存四键基线</button><button id="restore">恢复四键基线并核验</button><button id="quota">模拟报价写入配额不足</button><button id="unquota">恢复正常写入</button><button id="concurrent">启动双标签同时保存试验</button><button id="soak">开始10分钟稳定性观测</button><pre id="result"></pre><p id="soak-summary"></p><details><summary>采样详情</summary><pre id="soak-result"></pre></details><iframe id="app" title="真实应用测试区"></iframe><script src="domain.js"></script><script src="quote-core.js"></script><script>
if(location.port!=='8770')throw Error('Only QA origin');const keys=['logistics-company-directory-v1','logistics-quotes-v1','logistics-monthly-bills-v1','logistics-completed-ratings-v1'];let baseline=null,measurements=[],soakStart=0,soakSamples=[],timer=null;const out=v=>document.querySelector('#result').textContent=JSON.stringify(v,null,2);const day=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
document.querySelector('#seed').onclick=()=>{let start=performance.now(),today=day(),companies=Array.from({length:500},(_,i)=>({id:'qa-c'+i,name:'QA物流'+String(i).padStart(3,'0'),aliases:[],imported:true})),quotes=Array.from({length:10000},(_,i)=>{let w=Math.floor(i/10);return {company:companies[i%500].name,companyId:companies[i%500].id,country:['美国','德国','日本'][w%3],warehouse:'Q'+String.fromCharCode(65+Math.floor(w/999))+(w%999+1),channel:i%2?'海运':'铁路',currency:'CNY',unit:'kg',price:800+i%101,min:i%7?20:null,max:i%7?30+i%7:null,date:today,terms:'普货/不含税',timeBasis:i%7?'开船至交仓/自然日':'',timeUnverified:!(i%7),source:'合成容量数据.csv',sourceRow:i+2};}),db=QuoteCore.canonical({quotes,templates:[]}),bills={rows:quotes.slice(0,500).map((r,i)=>({company:r.company,companyId:r.companyId,date:today,bill:'QA-B'+i,waybill:'QA-W'+i,channel:r.channel,warehouse:r.warehouse,currency:i%3?'CNY':'USD',amount:100+i%99,paid:i%2?50:0,note:'合成测试',source:'QA.csv',sourceRow:i+2})),aliases:{}},ratings=quotes.slice(0,500).map((r,i)=>({id:'QA-R'+i,company:r.company,companyId:r.companyId,operator:'QA',shipment:'QA-W'+i,channel:Domain.channels[i%Domain.channels.length],shipped:today,finished:today,mode:i%5?'rated':'pending',price:i%5?8:null,time:i%5?9:null,coop:i%5?8:null,note:'合成测试'}));Domain.directory(companies);QuoteCore.validate(db);Domain.bills(bills);Domain.ratings(ratings,today);[companies,db,bills,ratings].forEach((v,i)=>localStorage.setItem(keys[i],JSON.stringify(v)));out({seedMs:performance.now()-start,companies:500,quotes:10000,bills:500,ratings:500,storageChars:keys.reduce((s,k)=>s+localStorage.getItem(k).length,0)});};
document.querySelector('#open').onclick=()=>{let start=performance.now(),frame=document.querySelector('#app');frame.onload=()=>{try{let doc=frame.contentDocument.querySelector('#module-frame')?.contentDocument,count=doc?.querySelectorAll('#comparison tbody tr').length;let item={kind:'load',ms:performance.now()-start,rows:count,nodes:doc?.querySelectorAll('*').length,heap:performance.memory?.usedJSHeapSize,at:new Date().toISOString()};measurements.push(item);out(measurements);}catch(e){out({error:e.message});}};frame.src='index.html?qa='+Date.now()+'#/channels';};
document.querySelector('#backup').onclick=()=>{baseline=Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]));out({backupKeys:Object.keys(baseline),bytes:JSON.stringify(baseline).length});};
document.querySelector('#restore').onclick=()=>{try{if(!baseline)throw Error('请先保存基线');let before=keys.map(k=>localStorage.getItem(k));let parsed=keys.map(k=>JSON.parse(baseline[k]));Domain.directory(parsed[0]);QuoteCore.validate(parsed[1]);Domain.bills(parsed[2]);Domain.ratings(parsed[3],day());keys.forEach((k,i)=>localStorage.setItem(k,JSON.stringify(parsed[i])));out({restoreExact:keys.every(k=>localStorage.getItem(k)===baseline[k]),rows:[parsed[1].quotes.length,parsed[2].rows.length,parsed[3].length]});}catch(e){out({error:e.message});}};
let originalSet=null;document.querySelector('#quota').onclick=()=>{let win=document.querySelector('#app').contentWindow.document.querySelector('#module-frame').contentWindow;if(!originalSet)originalSet=win.Storage.prototype.setItem;win.Storage.prototype.setItem=function(k,v){if(k==='logistics-quotes-v1')throw new DOMException('QA quota exhausted','QuotaExceededError');return originalSet.call(this,k,v);};out({fault:'报价写入配额不足已注入，仅测试页面'});};document.querySelector('#unquota').onclick=()=>{let win=document.querySelector('#app').contentWindow.document.querySelector('#module-frame').contentWindow;if(originalSet){win.Storage.prototype.setItem=originalSet;originalSet=null;}out({fault:'已恢复'});};
function sample(){let frame=document.querySelector('#app'),doc=frame.contentDocument?.querySelector('#module-frame')?.contentDocument;let s={version:doc?.querySelector('script[src*="quotes.js"]')?.src.split('?v=')[1]||'',elapsedSeconds:Math.round((performance.now()-soakStart)/1000),heap:performance.memory?.usedJSHeapSize,rows:doc?.querySelectorAll('#comparison tbody tr').length,error:doc?.querySelector('#app-error')?.textContent||'',quotes:JSON.parse(localStorage.getItem(keys[1])).quotes.length};soakSamples.push(s);document.querySelector('#soak-summary').textContent='固定版本 '+s.version+' · '+s.elapsedSeconds+'秒 · 页面 '+s.rows+'行 · 存储 '+s.quotes+'条 · '+(s.elapsedSeconds>=600?'十分钟观测完成':'观测中');document.querySelector('#soak-result').textContent=JSON.stringify({samples:soakSamples,complete:s.elapsedSeconds>=600},null,2);if(s.elapsedSeconds>=600)clearInterval(timer);}
document.querySelector('#soak').onclick=()=>{soakStart=performance.now();soakSamples=[];clearInterval(timer);sample();timer=setInterval(sample,30000);};
document.querySelector('#concurrent').onclick=()=>{let q=JSON.parse(localStorage.getItem(keys[1]));out({note:'并发试验由独立标签UI保存触发，不在此按钮自动修改业务库',before:q.quotes.length});};
</script></html>
