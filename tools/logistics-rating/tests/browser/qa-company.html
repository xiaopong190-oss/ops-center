<!doctype html><meta charset="utf-8"><title>公司同步与预览保护</title><h1>全局公司同步不重建业务iframe</h1><button id="prepare">建立待保存预览</button><button id="rename">模拟其他页面公司改名</button><button id="restore">还原测试前四键</button><pre id="result"></pre><iframe id="app" title="实际主壳" src="index.html#/import" style="width:100%;height:700px"></iframe><script>
if(location.port!=='8770')throw Error('Only QA origin');const keys=['logistics-company-directory-v1','logistics-quotes-v1','logistics-monthly-bills-v1','logistics-completed-ratings-v1'];let before=null,original=null;const main=()=>document.querySelector('#app').contentWindow,out=x=>document.querySelector('#result').textContent=JSON.stringify(x,null,2);document.querySelector('#prepare').onclick=()=>{before=Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]));original=main().document.querySelector('#module-frame');let win=original.contentWindow,r=JSON.parse(localStorage.getItem(keys[1])).quotes[0];win.dispatchEvent(new win.CustomEvent('matrix-batch-ready',{detail:{fileName:'QA-company.csv',records:[{values:[r.company,r.country,r.channel,r.warehouse,(r.price/100).toFixed(2),r.currency,r.unit,r.min,r.max,r.date,r.terms]}]}}));setTimeout(()=>out({previewRows:win.document.querySelectorAll('#preview tr').length,message:win.document.querySelector('#message').textContent}),100);};document.querySelector('#rename').onclick=()=>main().Domain.withWriteLock(()=>{let rows=JSON.parse(localStorage.getItem(keys[0])),r=rows[0];r.aliases.push(r.name);r.name='QA公司同步验证';main().Domain.directory(rows);localStorage.setItem(keys[0],JSON.stringify(rows));setTimeout(()=>{let frame=main().document.querySelector('#module-frame');out({sameIframe:frame===original,previewRows:frame.contentDocument.querySelectorAll('#preview tr').length,message:frame.contentDocument.querySelector('#message').textContent,globalName:frame.contentWindow.Companies.name(r.id),quotes:JSON.parse(localStorage.getItem(keys[1])).quotes.length});},200);});document.querySelector('#restore').onclick=()=>{keys.forEach(k=>before[k]===null?localStorage.removeItem(k):localStorage.setItem(k,before[k]));out({restoredExact:keys.every(k=>localStorage.getItem(k)===before[k])});};</script>
