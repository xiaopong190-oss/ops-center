<!doctype html><meta charset="utf-8"><title>导出与性能探针</title><h1>万行导出与页面性能探针 :8770</h1><p>测试探针截获生产代码生成的Blob，不触发文件保存；内容按生产CSV解析器检查，原始下载能力已由全量备份下载单独验证。</p><pre id="result"></pre><iframe id="q" title="报价比较区" src="quotes.html?view=compare" style="width:100%;height:700px"></iframe><script>
if(location.port!=='8770')throw Error('Only QA origin');let results=[],started=performance.now();const out=()=>document.querySelector('#result').textContent=JSON.stringify(results,null,2);document.querySelector('#q').onload=()=>{let win=document.querySelector('#q').contentWindow,doc=win.document,done=false;function loaded(){let count=doc.querySelectorAll('#comparison tbody tr').length;if(count===10000&&!done){done=true;results.push({kind:'load',ms:performance.now()-started,rows:count,nodes:doc.querySelectorAll('*').length,withWriteLock:Boolean(win.navigator.locks)});out();}}new MutationObserver(loaded).observe(doc.querySelector('#comparison'),{childList:true,subtree:true});loaded();let exportStart=0;doc.querySelector('#exportQuotes').addEventListener('click',()=>exportStart=performance.now(),true);let real=win.URL.createObjectURL.bind(win.URL);win.URL.createObjectURL=blob=>{blob.text().then(text=>{let rows=win.QuoteCore.parse(text),header=rows.shift(),q=JSON.parse(localStorage.getItem('logistics-quotes-v1')),expected=win.QuoteCore.latest(win.QuoteCore.weekQuotes(q.quotes,new Date().toLocaleDateString('sv-SE')));results.push({kind:'export',ms:performance.now()-exportStart,rows:rows.length,expectedRows:expected.length,columns:header.length,bytes:blob.size,headerKind:win.QuoteCore.csvKind(header),first:rows[0].slice(0,11)});out();});return real(blob);};let click=win.HTMLAnchorElement.prototype.click;win.HTMLAnchorElement.prototype.click=function(){if(this.download&&this.href.startsWith('blob:'))return;return click.call(this);};doc.addEventListener('change',e=>{if(!e.target.matches('#region,#provider,#country,#channel,#warehouse'))return;let start=performance.now(),id=e.target.id,value=e.target.value;win.requestAnimationFrame(()=>{results.push({kind:'filter',id,value,ms:performance.now()-start,rows:doc.querySelectorAll('#comparison tbody tr').length});out();});},true);};
</script>
