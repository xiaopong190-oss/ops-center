<!doctype html><meta charset="utf-8"><title>隔离故障与并发验证</title><h1>隔离故障与并发验证 :8770</h1><button id="prepare">生成待保存测试报价</button><button id="quota">注入配额写入故障</button><button id="normal">恢复正常写入</button><button id="race">两标签约定同时保存</button><pre id="result"></pre><iframe id="q" title="报价测试区" src="quotes.html?view=import" style="width:100%;height:750px"></iframe><script>
if(location.port!=='8770')throw Error('Only QA origin');let before=null,original=null,channel=new BroadcastChannel('qa-race-only'),reports=[];const frame=document.querySelector('#q'),out=v=>document.querySelector('#result').textContent=JSON.stringify(v,null,2);const label=new URLSearchParams(location.search).get('side')||'A';
function prepare(){let win=frame.contentWindow,r=JSON.parse(localStorage.getItem('logistics-quotes-v1')).quotes[0];before=localStorage.getItem('logistics-quotes-v1');let values=[r.company,r.country,r.channel,r.warehouse,((r.price+(label==='A'?1:2))/100).toFixed(2),r.currency,r.unit,r.min,r.max,r.date,r.terms];win.dispatchEvent(new win.CustomEvent('matrix-batch-ready',{detail:{fileName:'QA-fault.csv',records:[{values,timeBasis:r.timeBasis,timeUnverified:r.timeUnverified,sourceSheet:'合成测试',sourceRow:2}]}}));out({side:label,pending:win.document.querySelector('#message').textContent,ready:!win.document.querySelector('#commit').disabled});}
document.querySelector('#prepare').onclick=prepare;
document.querySelector('#quota').onclick=()=>{let win=frame.contentWindow;if(!original)original=win.Storage.prototype.setItem;win.Storage.prototype.setItem=function(k,v){if(k==='logistics-quotes-v1')throw new DOMException('QA quota exhausted','QuotaExceededError');return original.call(this,k,v);};out({fault:'配额不足已注入',side:label});};document.querySelector('#normal').onclick=()=>{if(original){frame.contentWindow.Storage.prototype.setItem=original;original=null;}out({fault:'已恢复',side:label});};
frame.onload=()=>{let button=frame.contentWindow.document.querySelector('#commit'),save=button.onclick;button.onclick=e=>{let startedAt=Date.now();let pending=save(e);Promise.resolve(pending).then(()=>{let win=frame.contentWindow,result={side:label,startedAt,savedAt:Date.now(),unchanged:localStorage.getItem('logistics-quotes-v1')===before,rows:JSON.parse(localStorage.getItem('logistics-quotes-v1')).quotes.length,message:win.document.querySelector('#message').textContent,pendingRows:win.document.querySelectorAll('#preview tr').length};reports.push(result);out(reports);channel.postMessage({report:result});});return pending;};};
function schedule(at){setTimeout(()=>frame.contentWindow.document.querySelector('#commit').onclick(new Event('click')),Math.max(0,at-Date.now()));}
channel.onmessage=e=>{if(e.data.at)schedule(e.data.at);if(e.data.report){reports.push(e.data.report);out(reports);}};document.querySelector('#race').onclick=()=>{let at=Date.now()+1500;channel.postMessage({at});schedule(at);out({scheduledAt:at,side:label});};
</script>
