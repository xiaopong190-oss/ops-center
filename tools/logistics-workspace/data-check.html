<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航序 · 旧数据检查</title><style>body{font:15px/1.7 system-ui;color:#192740;background:#f5f7fb;max-width:1100px;margin:30px auto;padding:20px}section{background:white;border:1px solid #dce4f0;padding:24px;border-radius:12px}button,a{font:inherit;color:#2857da}button{padding:9px 16px;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #dde4ef;padding:9px;text-align:left;overflow-wrap:anywhere}#report{overflow:auto}#status{white-space:pre-wrap}.note{color:#63748b}</style><section><h1>旧数据检查 · 只读</h1><p>检查当前网址、当前浏览器存储中的已有业务库。不会新建或清空数据库，不会合并或上传数据；检查不到其他浏览器、个人资料或其他网址的存储。</p><p id="origin"></p><button id="scan">检查已有数据</button> <button id="backup" disabled>导出找到的原始本地备份</button> <a href="/input">返回输入端</a><p id="status" role="status">尚未检查。</p><div id="report"></div><p class="note">若找到“输入端旧库”有数据而页面显示0，先导出备份，再处理读取或迁移。若仅展示缓存有数据，它不能完整替代输入端主库。若全部为空，请核对旧网址是否为 localhost、不同端口、云端地址，以及浏览器个人资料和普通/无痕模式。请勿发布空快照或清除网站数据。</p></section><script src="/data-check.js"></script></html>
