<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航序 · 录入同事登录</title><style>body{background:#f5f7fb;color:#192740;font:16px/1.6 system-ui;margin:0}main{max-width:460px;margin:9vh auto;padding:28px;background:white;border:1px solid #dde4ef;border-radius:14px}label{display:block;margin:18px 0}input,button{font:inherit;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px;width:100%}button{background:#2857da;color:white;cursor:pointer}a{color:#2857da}p{font-size:14px}#status{min-height:28px;color:#365b9a}button:disabled{opacity:.6}</style><main><h1>航序 · 录入同事登录</h1><p>使用现有运营中心的姓名和 M 码。登录信息通过本机服务转发至运营中心 HTTPS 接口。</p><form id="login"><label>姓名<input id="name" autocomplete="username" maxlength="100" required></label><label>M 码<input id="password" type="password" autocomplete="current-password" maxlength="200" required></label><button id="submit">登录并进入输入端</button></form><p id="status" role="status"></p><p><a href="/input">先进入本地输入端</a> · <a href="#" id="logout">退出当前登录</a></p><p>报价保存在这台电脑当前浏览器。清洗保存后，点击“发布展示快照”，等待读回核验成功。</p></main><script src="/portable-login.js"></script></html>
