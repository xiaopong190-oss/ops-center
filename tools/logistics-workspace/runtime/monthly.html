<style>body{font:14px system-ui;background:#f4f5f7;color:#1a1c21;margin:0}main{max-width:1280px;margin:auto;padding:28px}section{background:white;border:1px solid #e3e5ea;border-radius:12px;padding:20px;margin:18px 0}button,input,select{font:inherit;padding:8px;margin:5px;border:1px solid #cbd0da;border-radius:6px}button{cursor:pointer;color:#2450d8;background:white}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:10px;text-align:left;border-bottom:1px solid #eee}.scroll{overflow:auto}.muted{color:#5e6470}#message{white-space:pre-wrap;color:#8f3a05}a{color:#2450d8}.embedded main{margin-top:0}.embedded main>a:first-child{display:none}</style>
<main><a href="index.html#/import">← 物流商评级中心</a><h1>公司月度对账</h1><p class="muted">按账单日期归月；每家公司、每种币种独立统计。打开页面和跨月时自动刷新汇总。数据保存在当前浏览器，建议每月导出备份。</p>
<section><h2>导入与清洗</h2><p>先下载标准模板，把物流商对账单另存为 CSV 后导入。单次最多 2 MiB / 2000 行，总计最多 10000 行。支持常见中文列名；公司名称仅清理空格及全半角，别名由你确认合并。金额缺失或日期错误会列为异常，不计入汇总。</p><button id="template">下载账单 CSV 模板</button><input id="file" type="file" accept=".csv"><button id="commit" disabled>确认导入</button><div id="message" role="status"></div><div id="preview" class="scroll"></div></section>
<section><h2>公司名称统一</h2><label>原名称<input id="aliasFrom"></label><label>标准公司名称<input id="aliasTo"></label><button id="alias">保存别名并重新统计</button><p id="aliases" class="muted"></p></section>
<section><label>对账月份<input id="month" type="month"></label><label>公司<select id="company"><option value="">全部公司</option></select></label><button id="exportSummary">导出月度公司汇总</button><button id="exportDetail">导出当前明细</button><p id="total"></p><div id="summary" class="scroll"></div></section>
<section><h2>公司账单明细</h2><p class="muted">差额＝账单金额－已付金额；负数表示超付。这里的余额只覆盖已导入账单，不含未录入的期初余额。</p><div id="detail" class="scroll"></div></section></main></html>
