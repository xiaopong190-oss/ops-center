e="polite"></div><div id="content">正在读取产品…</div></section></main></div><div id="drawer-root"></div><div id="modal-root"></div><script>const configs={"task":[["title","跟进事项","text"],["owner","负责人","text"],["due","截止日期","date"],["target","验证标准 / 目标","text"],["status","任务状态","select",["待开始","进行中","待验证","已验证"]],["result","实际结果","text"],["evidence","证据链接","url"]],"shipment":[["title","批次编号","text"],["owner","负责人","text"],["method","运输方式","select",["海运","空运","快递","铁路","公路"]],["tracking","追踪单号","text"],["quantity","发货数量","number"],["planned","计划发货日","date"],["shipped","实际发货日","date"],["due","预计到货日","date"],["arrived","实际到货日","date"],["status","物流状态","select",["待发货","运输中","清关中","已签收","异常"]],["evidence","物流凭证链接","url"]],"cost":[["title","费用说明","text"],["category","成本类别","select",["研发","打样","采购","包装","物流","关税","仓储","平台费用","其他"]],["batch","关联批次编号","text"],["date","发生日期","date"],["budget","预算（人民币元）","number"],["actual","实际金额（人民币元）","number"],["status","付款状态","select",["未付","部分付款","已付"]],["evidence","凭证链接","url"]],"campaign":[["title","推广活动名称","text"],["owner","负责人","text"],["plan","运营方案","text"],["channel","推广方式","select",["站内广告","站外广告","内容种草","达人合作","优惠券","促销活动","邮件营销","自然流量"]],["start","开始日期","date"],["due","结束日期","date"],["target","目标 / 验证标准","text"],["budget","推广预算（人民币元）","number"],["actual","实际花费（人民币元）","number"],["sales","归因销售额（人民币元）","number"],["orders","订单数","number"],["status","执行状态","select",["未开始","进行中","待复盘","已完成","暂停"]],["result","复盘结果","text"],["evidence","报告证据链接","url"]]},productFields=[["name","产品名称","text"],["sku","SKU","text"],["owner","产品负责人","text"],["stage","开发阶段","select",["立项","调研","打样","测试","量产","已上架","暂停"]],["operating","当前运营状态","select",["待上架","测款中","推广中","稳定销售","优化中","清库存","暂停"]],["health","经营现状","select",["正常","待处理","风险"]],["purpose","运营目的","text"],["issue","当前问题 / 状态依据","text"],["next","下一步行动","text"],["due","下次跟进日","date"]],operating=["待上架","测款中","推广中","稳定销售","优化中","清库存","暂停"],kindName={"task":"跟进事项","shipment":"发货物流","cost":"成本费用","campaign":"运营推广","product":"产品状态"};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const late=r=>r.body.due&&r.body.due<today()&&!['已验证','已完成','已签收','暂停'].includes(r.body.status||r.body.operating), sum=(rs,k)=>rs.reduce((s,r)=>s+(typeof r.body[k]==='number'?r.body[k]:0),0), badge=t=>'<span class="badge '+(/风险|异常|逾期|超预算/.test(t)?'red':/已验证|已签收|稳定|正常/.test(t)?'green':/暂停|待/.test(t)?'amber':'blue')+'">'+esc(t)+'</span>';
function toast(text,bad=false){$('#notice').innerHTML='<div class="'+(bad?'error':'success')+'" role="'+(bad?'alert':'status')+'">'+esc(text)+'</div>';}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const v=await r.json();if(!r.ok)throw Error(v.error||'保存失败');return v;}
async function load(){try{data=await api('/api/workbench');render();}catch(e){toast(e.message,true);}}
function productName(id){return data.products.find(p=>p.id===id)?.body.name||'产品';}
function record(r){const b=r.body;return '<article class="record"><div class="record-head"><div><span class="eyebrow">'+esc(kindName[r.kind])+'</span><h3>'+esc(b.title)+'</h3></div>'+badge(late(r)?'逾期':b.status)+'<button class="text-button" data-edit="'+r.id+'">更新</button></div><div class="record-meta"><span>'+esc(b.owner||b.category||'费用记录')+'</span><span>'+esc(b.due?'截止 '+b.due:b.date||'日期待补')+'</span><span>'+esc(productName(r.product_id))+'</span></div>'+(b.target?'<p>验证标准：'+esc(b.target)+'</p>':'')+(b.plan?'<p>运营方案：'+esc(b.plan)+'</p>':'')+(r.kind==='campaign'?'<p>推广方式：'+esc(b.channel)+'</p>':'')+(r.kind==='shipment'?'<p>'+esc(b.method)+' · '+esc(b.quantity??'待填')+' 件 · 单号 '+esc(b.tracking||'待补')+'<br>计划发货 '+esc(b.planned||'待填')+'　实际发货 '+esc(b.shipped||'待发货')+'<br>预计到货 '+esc(b.due||'待填')+'　实际到货 '+esc(b.arrived||'未到货')+'</p>':'')+(['cost','campaign'].includes(r.kind)?'<div class="amounts"><span>预算 <strong>'+(typeof b.budget==='number'?money(b.budget):'待补')+'</strong></span><span>实际 <strong>'+(typeof b.actual==='number'?money(b.actual):'待补')+'</strong></span>'+(typeof b.actual==='number'&&typeof b.budget==='number'&&b.actual>b.budget?badge('超预算'):'')+(r.kind==='campaign'?'<span>ROAS <strong>'+(b.actual>0&&typeof b.sales==='number'?(b.sales/b.actual).toFixed(2)+'x':'待补')+'</strong></span><span>获客成本 <strong>'+(b.orders>0&&typeof b.actual==='number'?money(b.actual/b.orders):'待补')+'</strong></span>':'')+'</div>':'')+(b.result?'<p>实际结果：'+esc(b.result)+'</p>':'')+(b.evidence?'<a class="evidence" target="_blank" rel="noreferrer" href="'+esc(b.evidence)+'">查看验证证据 ↗</a>':'')+'</article>';}
function empty(text){return '<div class="empty"><span style="font-size:28px">◇</span><p>'+esc(text)+'</p></div>';}
function timeline(pid,limit=Infinity){const events=data.events.filter(e=>!pid||e.product_id===pid).slice(0,limit);return '<div class="timeline">'+events.map(e=>{const a=JSON.parse(e.after),b=e.before?JSON.parse(e.before):{};return '<article><div class="time-dot"></div><div><div class="event-heading"><strong>'+esc(e.action)+'</strong><time>'+new Date(e.created_at).toLocaleString('zh-CN')+'</time></div><p>'+esc(e.reason)+'</p><span class="muted">操作人：'+esc(e.actor)+'</span><details><summary>查看变更前后</summary><div class="change-list">'+Object.keys(a).filter(k=>a[k]!==b[k]).map(k=>'<p><strong>'+esc([...productFields,...Object.values(configs).flat()].find(f=>f[0]===k)?.[1]||k)+'</strong>：'+esc(b[k]??'未填写')+' → '+esc(a[k]??'未填写')+'</p>').join('')+'</div></details></div></article>';}).join('')+(events.length?'':empty('暂无变更记录。保存后将自动记入时间线。'))+'</div>';}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#crumb').textContent=view;$('#title').textContent=view==='总览'?'产品跟进总览':view;$('#subtitle').textContent=view==='变更记录'?'查看谁在什么时间、因为什么修改了记录。':view==='验证中心'?'目标、实际结果与证据，组成完整的验证记录。':'开发、交付与运营，保持每一步都有下一步。';const tasks=data.records.filter(r=>r.kind==='task'&&r.body.status!=='已验证'),verify=data.records.filter(r=>['待验证','待复盘'].includes(r.body.status)),cost=data.records.filter(r=>['cost','campaign'].includes(r.kind));let html='';
if(view==='总览')html+='<div class="metrics">'+[['产品数量',data.products.length,'开发与运营同步跟进'],['需要跟进',tasks.length,tasks.filter(late).length+' 项逾期'],['等待验证',verify.length,'结果与证据待确认'],['累计投入',money(sum(cost,'actual')),'已填预算 '+money(sum(cost,'budget'))]].map(([l,v,h])=>'<div class="metric"><span>'+esc(l)+'</span><strong>'+esc(v)+'</strong><small>'+esc(h)+'</small></div>').join('')+'</div><div class="section-title"><h2>产品状态</h2><span class="muted">金额为累计已填发生额；不是利润</span></div>';
if(['总览','产品'].includes(view)){const ps=data.products.filter(p=>(filter==='全部状态'||p.body.operating===filter)&&[p.body.name,p.body.sku,p.body.owner].join(' ').toLowerCase().includes(search.toLowerCase()));html+='<div class="toolbar"><div class="search"><span>⌕</span><input id="search" aria-label="搜索产品" placeholder="搜索产品、SKU 或负责人" value="'+esc(search)+'"></div><select id="filter" aria-label="运营状态筛选">'+['全部状态',...operating].map(s=>'<option '+(s===filter?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select><span class="muted">'+ps.length+' 个产品</span></div><div class="product-table"><div class="table-head"><span>产品 / SKU</span><span>开发阶段</span><span>当前运营状态</span><span>下一步行动</span><span>负责人 / 跟进日</span><span>累计投入</span></div>'+ps.map((p,i)=>{const b=p.body;return '<button class="product-row" data-product="'+p.id+'"><span class="product-name"><span class="product-icon color'+i%3+'">◇</span><span><strong>'+esc(b.name)+'</strong><small>'+esc(b.sku)+'</small></span></span><span>'+badge(b.stage)+'</span><span>'+badge(b.operating)+'<small class="'+(b.health==='风险'?'risk':'')+'">'+esc(b.health)+'</small></span><span class="next-action">'+esc(b.next)+'<small>'+esc(b.issue)+'</small></span><span>'+esc(b.owner)+'<small class="'+(late(p)?'risk':'')+'">'+esc(b.due)+(late(p)?' · 逾期':'')+'</small></span><span class="row-money">'+money(sum(cost.filter(r=>r.product_id===p.id),'actual'))+' <span>›</span></span></button>';}).join('')+(ps.length?'':empty('建立一个产品，开始记录开发、物流及运营进展。'))+'</div><div class="workflow-note"><span>✓</span><span>事项写明负责人和验证标准，完成时提交结果与证据。修改自动记录。</span>'+(data.products.length?'':'<button class="quiet" id="demo">加入示例体验</button>')+'</div>';if(view==='总览'&&data.products.length)html+='<div class="bottom-grid"><div class="panel"><div class="section-title"><h2>近期跟进</h2><button class="text-button" data-view="待办跟进">全部待办</button></div>'+tasks.slice(0,3).map(record).join('')+(tasks.length?'':empty('暂无未完成事项'))+'</div><div class="panel"><div class="section-title"><h2>近期变更</h2></div>'+timeline(undefined,3)+'</div></div>';}
if(view==='待办跟进')html+='<div class="record-grid">'+tasks.sort((a,b)=>(a.body.due||'').localeCompare(b.body.due||'')).map(record).join('')+(tasks.length?'':empty('暂无待办。在产品详情中添加跟进事项。'))+'</div>';
if(view==='验证中心')html+='<div class="verification-note">已验证表示操作人已确认结果并提供证据链接。证据内容需人工核验，系统不会自动判断结论。</div><div class="section-title"><h2>等待验证与复盘</h2><span>'+verify.length+' 项</span></div><div class="record-grid">'+verify.map(record).join('')+(verify.length?'':empty('暂无待验证事项。执行完成后将事项设为待验证。'))+'</div><div class="section-title"><h2>已验证记录</h2></div><div class="record-grid">'+data.records.filter(r=>r.body.status==='已验证'||r.kind==='campaign'&&r.body.status==='已完成').map(record).join('')+'</div>';
if(view==='变更记录')html+=timeline();$('#content').innerHTML=html;renderDrawer();}
function renderDrawer(){const p=data.products.find(r=>r.id===selected);if(!p){$('#drawer-root').innerHTML='';return;}const b=p.body,rs=data.records.filter(r=>r.product_id===p.id&&r.kind===tab);$('#drawer-root').innerHTML='<div class="drawer-backdrop" data-backdrop><section class="drawer" aria-label="产品详情"><div class="drawer-heading"><div><span class="eyebrow">'+esc(b.sku)+'</span><h2>'+esc(b.name)+'</h2></div><button class="icon-button" data-close aria-label="关闭详情">✕</button></div><div class="status-strip">'+badge(b.stage)+badge(b.operating)+badge(b.health)+'<button class="text-button" data-edit-product>更新当前状态</button></div><div class="product-context">'+[['运营目的',b.purpose],['状态依据',b.issue],['下一步行动',b.next],['负责人 / 跟进日',b.owner+' · '+b.due]].map(([l,v])=>'<p><label>'+esc(l)+'</label>'+esc(v)+'</p>').join('')+'</div><div class="detail-tabs">'+[['task','跟进'],['shipment','物流'],['cost','成本'],['campaign','运营推广'],['history','历史']].map(([k,l])=>'<button class="'+(tab===k?'selected':'')+'" data-tab="'+k+'">'+l+'</button>').join('')+'</div><div class="detail-content">'+(tab==='history'?timeline(p.id):'<div class="section-title"><h3>'+kindName[tab]+'</h3><button class="primary small" data-add="'+tab+'">＋ 添加</button></div>'+(tab==='cost'?'<p class="muted">非推广费用填写在这里；推广花费填运营推广，避免重复计入。</p>':'')+rs.map(record).join('')+(rs.length?'':empty('暂无'+kindName[tab]+'，点击添加开始记录。')))+'</div></section></div>';}
function open(kind,row){modal={kind,row};const fields=kind==='product'?productFields:configs[kind],b=row?.body||{};$('#modal-root').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="form-title"><div class="modal-heading"><h2 id="form-title">'+(row?'更新':'新增')+kindName[kind]+'</h2><button class="icon-button" data-cancel aria-label="关闭表单">✕</button></div><form id="record-form"><div class="form-grid">'+fields.map(([k,l,t,opts])=>'<label class="'+(['issue','purpose','next','plan','target','result','evidence','title'].includes(k)?'wide':'')+'"><span>'+esc(l)+'</span>'+(t==='select'?'<select name="'+k+'"><option value="">请选择</option>'+opts.map(o=>'<option '+(o===b[k]?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':['issue','purpose','next','plan','target','result'].includes(k)?'<textarea name="'+k+'" rows="2">'+esc(b[k]??'')+'</textarea>':'<input name="'+k+'" type="'+t+'" '+(t==='number'?'min="0" step="any"':'')+' value="'+esc(b[k]??'')+'">')+'</label>').join('')+'<label><span>操作人（必填）</span><input name="actor" required value="'+esc($('#actor').value)+'"></label><label class="wide"><span>本次变更原因（必填）</span><textarea name="reason" required rows="2" placeholder="说明判断依据、调整原因或本次进展"></textarea></label></div><p class="form-note">保存后自动记录操作人、时间及变更前后值。已验证需填写实际结果与证据。</p><div id="form-error"></div><div class="form-footer"><button type="button" class="quiet" data-cancel>取消</button><button class="primary" id="save">保存并记录</button></div></form></section></div>';setTimeout(()=>$('#record-form input, #record-form select')?.focus(),0);$('#record-form').onsubmit=save;}
async function save(e){e.preventDefault();if(busy)return;const f=new FormData(e.target),body={},spec=modal.kind==='product'?productFields:configs[modal.kind];for(const[k,,t]of spec)body[k]=t==='number'&&f.get(k)!==''?Number(f.get(k)):f.get(k);busy=true;$('#save').disabled=true;try{const v=await api('/api/workbench',{kind:modal.kind,id:modal.row?.id,version:modal.row?.version,productId:selected,body,reason:f.get('reason'),actor:f.get('actor')});$('#actor').value=f.get('actor');localStorage.setItem('product-workspace-actor',f.get('actor'));if(modal.kind==='product')selected=v.id;modal=null;$('#modal-root').innerHTML='';await load();toast('已保存，本次变更已记入时间线');}catch(e){$('#form-error').innerHTML='<div class="error" role="alert">'+esc(e.message)+'</div>';$('#save').disabled=false;}finally{busy=false;}}
async function demo(){if(busy)return;const actor=$('#actor').value.trim();if(!actor){toast('请先在右上角填写操作人。',true);$('#actor').focus();return;}busy=true;$('#demo').disabled=true;try{const post=async(kind,body,productId)=>api('/api/workbench',{kind,body,productId,reason:'加载示例数据，供流程体验',actor});const p=await post('product',{name:'示例｜桌面收纳盒',sku:'DEMO-BOX',owner:'示例负责人',stage:'已上架',operating:'测款中',health:'待处理',purpose:'验证目标人群和关键词转化',issue:'广告点击已有增长，需验证订单转化',next:'复盘关键词并调整主图',due:today()});await post('task',{title:'示例｜复盘关键词转化',owner:'示例负责人',due:today(),target:'检查7天广告数据，确认高花费无订单词',status:'待验证'},p.id);await post('cost',{title:'示例｜首批采购',category:'采购',date:today(),budget:10000,actual:10500,status:'已付'},p.id);await post('shipment',{title:'DEMO-LOT-001',owner:'示例负责人',method:'海运',tracking:'DEMO-TRACK',quantity:500,planned:today(),shipped:today(),due:today(),status:'运输中'},p.id);await post('campaign',{title:'示例｜新品关键词测试',owner:'示例负责人',plan:'分组测试关键词，复盘高花费无订单词',channel:'站内广告',start:today(),due:today(),target:'目标ROAS 3.0x',budget:1500,actual:1800,sales:6000,orders:40,status:'待复盘'},p.id);toast('已加入示例。示例仅供体验，请新建真实产品录入业务数据。');}catch(e){toast(e.message,true);}finally{busy=false;await load();}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.view){view=b.dataset.view;selected=null;render();}if(b?.dataset.product){selected=b.dataset.product;tab='task';renderDrawer();}if(b?.dataset.tab){tab=b.dataset.tab;renderDrawer();}if(b?.hasAttribute('data-close')||e.target.hasAttribute('data-backdrop')){selected=null;renderDrawer();}if(b?.hasAttribute('data-new'))open('product');if(b?.dataset.add)open(b.dataset.add);if(b?.hasAttribute('data-edit-product'))open('product',data.products.find(p=>p.id===selected));if(b?.dataset.edit){const r=data.records.find(r=>r.id===b.dataset.edit);selected=r.product_id;open(r.kind,r);}if(b?.hasAttribute('data-cancel')&&!busy){modal=null;$('#modal-root').innerHTML='';}if(b?.id==='refresh')load();if(b?.id==='demo')demo();});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);}if(e.target.id==='actor')localStorage.setItem('product-workspace-actor',e.target.value);});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!busy){if(modal){modal=null;$('#modal-root').innerHTML='';}else{selected=null;renderDrawer();}}if(e.key==='Tab'&&modal){const elements=[...$('#modal-root').querySelectorAll('button,input,select,textarea,a')].filter(n=>!n.disabled),first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});$('#actor').value=localStorage.getItem('product-workspace-actor')||'';load();
</script></body></html>
